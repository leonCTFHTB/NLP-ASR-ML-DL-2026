<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.13 · Reducir la puntuación"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.13 · Reducir la puntuación</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">Paso de descenso simple para un par; contexto uⱼ fijo y sin reescala adaptativa.</text><line x1="145" y1="490" x2="640" y2="490" stroke="#a8b0c1" stroke-width="2" marker-end="url(#arrow)"/><line x1="145" y1="490" x2="145" y2="175" stroke="#a8b0c1" stroke-width="2" marker-end="url(#arrow)"/><line x1="145" y1="490" x2="520" y2="280" stroke="#d9c58f" stroke-width="4" marker-end="url(#arrow)"/><text x="545" y="275" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#d9c58f">uⱼ</text><line x1="145" y1="490" x2="300" y2="280" stroke="#91b9e3" stroke-width="4" marker-end="url(#arrow)"/><text x="280" y="250" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#91b9e3">vᵢ</text><line x1="300" y1="280" x2="205" y2="333" stroke="#91b9e3" stroke-width="5" marker-end="url(#arrow)"/><text x="213" y="318" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#b8a5ee">vᵢ nuevo</text><rect x="720" y="170" width="420" height="345" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="740" y="206" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Residual positivo</text><text x="745" y="270" font-family="DejaVu Sans,sans-serif" font-size="33" font-weight="400" text-anchor="start" fill="#91b9e3">r &gt; 0</text><text x="745" y="340" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#e5e7eb">Δvᵢ = −2η h(x) r uⱼ</text><text x="745" y="410" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#d9c58f">Dirección: −uⱼ</text><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">El cambio del producto punto es −2η h(x) r ‖uⱼ‖²; cambia su signo con r.</text></svg>