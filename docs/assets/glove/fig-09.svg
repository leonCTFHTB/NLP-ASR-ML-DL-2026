<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.9 · De una predicción a la pérdida"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.9 · De una predicción a la pérdida</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">Ejemplo didáctico: x = 4, xₘₐₓ = 5 y α = 0,75.</text><rect x="55" y="175" width="320" height="220" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="75" y="211" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">1 · Objetivo</text><text x="75" y="270" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#91b9e3">log(4) ≈ 1,3863</text><text x="75" y="335" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#e5e7eb">ŷ = 2,0</text><rect x="440" y="175" width="320" height="220" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="460" y="211" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">2 · Residual</text><text x="460" y="270" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#91b9e3">r = 2 − 1,3863</text><text x="460" y="335" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#e5e7eb">r ≈ 0,6137</text><rect x="825" y="175" width="320" height="220" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="845" y="211" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">3 · Peso</text><text x="845" y="270" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#91b9e3">h(4) = (4/5)⁰·⁷⁵</text><text x="845" y="335" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#e5e7eb">h(4) ≈ 0,8459</text><rect x="140" y="445" width="920" height="110" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="600" y="515" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="600" text-anchor="middle" fill="#d9c58f">ℓᵢⱼ = h(xᵢⱼ) rᵢⱼ² ≈ 0,8459 × 0,6137² ≈ 0,3186</text><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">La pérdida global suma estas contribuciones solo sobre pares con xᵢⱼ &gt; 0.</text></svg>