<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.2 · Un corpus, dos formas de aprender"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.2 · Un corpus, dos formas de aprender</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">Ambos métodos incorporan evidencia de muchas ventanas del corpus.</text><rect x="50" y="145" width="510" height="395" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="70" y="181" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Word2Vec</text><rect x="640" y="145" width="510" height="395" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="660" y="181" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">GloVe</text><text x="75" y="235" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#91b9e3">gato → duerme</text><line x1="290" y1="227" x2="340" y2="227" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><circle cx="380" cy="227" r="15" fill="#191d26" stroke="#b8a5ee" stroke-width="3"/><text x="75" y="300" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#91b9e3">gato → duerme</text><line x1="290" y1="292" x2="340" y2="292" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><circle cx="380" cy="292" r="15" fill="#191d26" stroke="#b8a5ee" stroke-width="3"/><text x="75" y="365" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#91b9e3">gato → duerme</text><line x1="290" y1="357" x2="340" y2="357" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><circle cx="380" cy="357" r="15" fill="#191d26" stroke="#b8a5ee" stroke-width="3"/><text x="75" y="480" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#e5e7eb">Actualizaciones a partir de ejemplos</text><text x="670" y="250" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#91b9e3">(gato, duerme) → x = 3</text><line x1="890" y1="280" x2="890" y2="345" stroke="#91b9e3" stroke-width="4" marker-end="url(#arrow)"/><rect x="685" y="365" width="415" height="110" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="715" y="430" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#e5e7eb">Ajuste al objetivo log(3)</text><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">Negative sampling evita el softmax completo; GloVe añade el costo de construir y guardar X.</text></svg>