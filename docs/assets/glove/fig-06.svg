<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.6 · De la diferencia al cociente"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.6 · De la diferencia al cociente</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">Identidad exacta: exp(a − b) = exp(a) / exp(b).</text><rect x="55" y="160" width="1090" height="125" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="600" y="240" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="600" text-anchor="middle" fill="#91b9e3">exp[(vᵢ − vⱼ)ᵀuₖ] = exp(vᵢᵀuₖ) / exp(vⱼᵀuₖ)</text><rect x="65" y="335" width="320" height="185" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="85" y="371" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Δ &gt; 0</text><text x="85" y="425" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#d9c58f">exp(Δ) &gt; 1</text><text x="85" y="475" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#e5e7eb">Favorece al centro i</text><rect x="440" y="335" width="320" height="185" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="460" y="371" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Δ = 0</text><text x="460" y="425" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#d9c58f">exp(Δ) = 1</text><text x="460" y="475" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#e5e7eb">Puntuaciones iguales</text><rect x="815" y="335" width="320" height="185" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="835" y="371" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Δ &lt; 0</text><text x="835" y="425" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#d9c58f">0 &lt; exp(Δ) &lt; 1</text><text x="835" y="475" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#e5e7eb">Favorece al centro j</text><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">Para el modelo final: log Rₖ ≈ (vᵢ − vⱼ)ᵀuₖ + bᵢ − bⱼ − log xᵢ + log xⱼ.</text></svg>