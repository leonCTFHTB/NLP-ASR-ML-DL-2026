<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.14 · Peso y residual son factores distintos"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.14 · Peso y residual son factores distintos</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">El peso modula una contribución; no es una garantía de estabilidad global.</text><rect x="65" y="165" width="490" height="330" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="85" y="201" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Par A · peso pequeño</text><text x="95" y="255" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#91b9e3">h(x) = 0.2      r = 2</text><text x="95" y="325" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#d9c58f">|2 h(x) r| = 0.8</text><line x1="100" y1="405" x2="140.0" y2="405" stroke="#91b9e3" stroke-width="4" marker-end="url(#arrow)"/><rect x="645" y="165" width="490" height="330" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="665" y="201" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Par B · peso saturado</text><text x="675" y="255" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#91b9e3">h(x) = 1      r = 2</text><text x="675" y="325" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#d9c58f">|2 h(x) r| = 4</text><line x1="680" y1="405" x2="880" y2="405" stroke="#91b9e3" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="550" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="500" text-anchor="middle" fill="#e5e7eb">Si r = 0, el gradiente de ese par es cero.</text><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">Otros pares aún modifican los parámetros compartidos; h(x) = 1 no limita el valor de r.</text></svg>