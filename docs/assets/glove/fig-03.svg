<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.3 · El archivo de coocurrencias"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.3 · El archivo de coocurrencias</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">Ejemplo exacto: «el gato duerme», radio 1, peso 1 y sin cruzar oraciones.</text><text x="300" y="190" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="middle" fill="#d9c58f">el</text><text x="450" y="190" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="middle" fill="#d9c58f">gato</text><text x="600" y="190" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="middle" fill="#d9c58f">duerme</text><text x="75" y="265" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#d9c58f">el</text><rect x="230" y="215" width="140" height="75" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="300" y="265" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#a8b0c1">0</text><rect x="380" y="215" width="140" height="75" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="450" y="265" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#91b9e3">1</text><rect x="530" y="215" width="140" height="75" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="600" y="265" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#a8b0c1">0</text><text x="75" y="355" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#d9c58f">gato</text><rect x="230" y="305" width="140" height="75" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="300" y="355" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#91b9e3">1</text><rect x="380" y="305" width="140" height="75" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="450" y="355" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#a8b0c1">0</text><rect x="530" y="305" width="140" height="75" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="600" y="355" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#91b9e3">1</text><text x="75" y="445" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#d9c58f">duerme</text><rect x="230" y="395" width="140" height="75" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="300" y="445" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#a8b0c1">0</text><rect x="380" y="395" width="140" height="75" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="450" y="445" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#91b9e3">1</text><rect x="530" y="395" width="140" height="75" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="600" y="445" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#a8b0c1">0</text><rect x="760" y="185" width="380" height="300" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="780" y="221" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Fila «gato»</text><text x="790" y="270" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#e5e7eb">xᵢ = 1 + 0 + 1 = 2</text><text x="790" y="330" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#91b9e3">P(el | gato) = 1/2</text><text x="790" y="380" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#91b9e3">P(duerme | gato) = 1/2</text><text x="75" y="545" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#e5e7eb">Fila = centro i · columna = contexto j</text><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">Con pesos 1/distancia los conteos pueden ser fraccionarios; xᵢ suma eventos de contexto.</text></svg>