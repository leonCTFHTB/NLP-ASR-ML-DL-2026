<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.4 · Comparar con la misma pregunta"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.4 · Comparar con la misma pregunta</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">Cambian los centros: ice / steam. Se mantiene el contexto: solid.</text><circle cx="230" cy="265" r="77" fill="#191d26" stroke="#91b9e3" stroke-width="3"/><text x="230" y="273" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#91b9e3">ice</text><circle cx="230" cy="455" r="77" fill="#191d26" stroke="#b8a5ee" stroke-width="3"/><text x="230" y="463" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#b8a5ee">steam</text><rect x="555" y="255" width="360" height="175" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="575" y="291" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Pregunta común</text><text x="590" y="360" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#d9c58f">¿Contexto solid?</text><line x1="315" y1="265" x2="545" y2="305" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><line x1="315" y1="455" x2="545" y2="385" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><text x="75" y="165" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#a8b0c1">Centro</text><text x="375" y="245" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#91b9e3">1,9 × 10⁻⁴</text><text x="375" y="465" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#b8a5ee">2,2 × 10⁻⁵</text><text x="640" y="520" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="600" text-anchor="start" fill="#d9c58f">R(solid) ≈ 8,64</text><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">Cociente calculado con probabilidades redondeadas de la tabla 1 de Pennington et al. (2014).</text></svg>