<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Anatomía de GloVe"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">Anatomía de GloVe</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">Del corpus a los conteos; de los conteos a dos tablas de vectores.</text><rect x="60" y="170" width="300" height="300" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="80" y="206" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Corpus</text><text x="85" y="390" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#e5e7eb">el hielo es sólido</text><text x="85" y="430" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">el vapor es gas</text><rect x="450" y="170" width="300" height="300" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="470" y="206" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Coocurrencias X</text><text x="475" y="390" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#e5e7eb">centro × contexto</text><text x="475" y="430" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">solo pares observados</text><rect x="840" y="170" width="300" height="300" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="860" y="206" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Representaciones</text><text x="865" y="390" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#e5e7eb">vectores W y U</text><text x="865" y="430" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">embedding: W + U</text><line x1="85" y1="250" x2="255" y2="250" stroke="#91b9e3" stroke-width="7"/><line x1="85" y1="280" x2="305" y2="280" stroke="#91b9e3" stroke-width="7"/><line x1="85" y1="310" x2="225" y2="310" stroke="#91b9e3" stroke-width="7"/><rect x="480" y="225" width="38" height="23" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><rect x="533" y="225" width="38" height="23" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><rect x="586" y="225" width="38" height="23" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><rect x="639" y="225" width="38" height="23" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><rect x="480" y="257" width="38" height="23" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><rect x="533" y="257" width="38" height="23" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><rect x="586" y="257" width="38" height="23" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><rect x="639" y="257" width="38" height="23" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><rect x="480" y="289" width="38" height="23" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><rect x="533" y="289" width="38" height="23" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><rect x="586" y="289" width="38" height="23" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><rect x="639" y="289" width="38" height="23" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><rect x="480" y="321" width="38" height="23" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><rect x="533" y="321" width="38" height="23" rx="14" fi