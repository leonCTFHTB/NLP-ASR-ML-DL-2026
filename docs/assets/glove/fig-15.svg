<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.15 · Del residual al paso de AdaGrad"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.15 · Del residual al paso de AdaGrad</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">Primero se acumula el gradiente; después el optimizador calcula la actualización.</text><rect x="55" y="160" width="320" height="185" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="75" y="196" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Peso</text><text x="215" y="260" font-family="DejaVu Sans,sans-serif" font-size="33" font-weight="600" text-anchor="middle" fill="#91b9e3">h(xᵢⱼ)</text><text x="215" y="315" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#e5e7eb">cuánto pondera</text><rect x="440" y="160" width="320" height="185" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="460" y="196" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Residual</text><text x="600" y="260" font-family="DejaVu Sans,sans-serif" font-size="33" font-weight="600" text-anchor="middle" fill="#91b9e3">rᵢⱼ</text><text x="600" y="315" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#e5e7eb">error con signo</text><rect x="825" y="160" width="320" height="185" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="845" y="196" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Dirección</text><text x="985" y="260" font-family="DejaVu Sans,sans-serif" font-size="33" font-weight="600" text-anchor="middle" fill="#91b9e3">uⱼ</text><text x="985" y="315" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#e5e7eb">vector de contexto</text><text x="600" y="400" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="500" text-anchor="middle" fill="#d9c58f">gᵢ = 2 Σⱼ: xᵢⱼ &gt; 0 h(xᵢⱼ) rᵢⱼ uⱼ</text><rect x="75" y="450" width="1050" height="110" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="600" y="495" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#b8a5ee">Gₜ = Gₜ₋₁ + gₜ ⊙ gₜ</text><text x="600" y="535" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#91b9e3">θₜ₊₁ = θₜ − η gₜ / (√Gₜ + ε)</text><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">Operaciones por coordenada. Una coordenada con menor acumulado conserva una tasa efectiva mayor.</text></svg>