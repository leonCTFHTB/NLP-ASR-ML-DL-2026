<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.8 · Vectores y sesgos"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.8 · Vectores y sesgos</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">Ejemplo numérico didáctico para un solo par observado.</text><rect x="55" y="160" width="500" height="340" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="75" y="196" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Producto punto</text><text x="85" y="255" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#91b9e3">vᵢ = (1; 2)     uⱼ = (0,2; 0,4)</text><text x="85" y="320" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#e5e7eb">vᵢᵀuⱼ = 1 × 0,2 + 2 × 0,4</text><text x="85" y="390" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="600" text-anchor="start" fill="#d9c58f">= 1,0</text><rect x="610" y="160" width="535" height="340" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="630" y="196" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Puntuación total</text><text x="640" y="255" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#b8a5ee">bᵢ = 0,4        cⱼ = 0,6</text><text x="640" y="325" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#e5e7eb">ŷᵢⱼ = 1,0 + 0,4 + 0,6 = 2,0</text><text x="640" y="405" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#d9c58f">Objetivo: log(xᵢⱼ)</text><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">El producto punto depende de normas y ángulo. Los sesgos son parámetros escalares aprendidos.</text></svg>