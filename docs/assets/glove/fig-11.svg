<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.11 · Un regulador del error"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.11 · Un regulador del error</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">Analogía: una perilla ajusta una puntuación hasta acercarla a una marca objetivo.</text><line x1="150" y1="350" x2="1050" y2="350" stroke="#a8b0c1" stroke-width="5"/><line x1="750" y1="280" x2="750" y2="420" stroke="#d9c58f" stroke-width="5"/><text x="750" y="245" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="600" text-anchor="middle" fill="#d9c58f">Objetivo log(x)</text><circle cx="350" cy="350" r="24" fill="#191d26" stroke="#91b9e3" stroke-width="3"/><line x1="390" y1="350" x2="705" y2="350" stroke="#91b9e3" stroke-width="5" marker-end="url(#arrow)"/><text x="350" y="455" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#91b9e3">ŷ por debajo</text><circle cx="980" cy="350" r="24" fill="#191d26" stroke="#b8a5ee" stroke-width="3"/><line x1="940" y1="380" x2="790" y2="380" stroke="#91b9e3" stroke-width="5" marker-end="url(#arrow)"/><text x="980" y="455" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#b8a5ee">ŷ por encima</text><text x="600" y="540" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#e5e7eb">Se corrige el residual r = ŷ − log(x)</text><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">No son resortes entre puntos: la pérdida depende del producto punto y de los sesgos.</text></svg>