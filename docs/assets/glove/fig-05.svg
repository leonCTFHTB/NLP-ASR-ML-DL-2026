<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.5 · De tres palabras a una relación"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.5 · De tres palabras a una relación</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">Dos vectores de centro y un vector del mismo contexto.</text><rect x="55" y="160" width="490" height="350" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="75" y="196" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Geometría aprendida</text><text x="90" y="250" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#91b9e3">vᵢ = vector de ice</text><text x="90" y="305" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#b8a5ee">vⱼ = vector de steam</text><text x="90" y="380" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#d9c58f">uₖ = vector de solid</text><text x="90" y="455" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#e5e7eb">Δ = (vᵢ − vⱼ)ᵀuₖ</text><line x1="555" y1="340" x2="650" y2="340" stroke="#91b9e3" stroke-width="4" marker-end="url(#arrow)"/><rect x="665" y="160" width="480" height="350" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="685" y="196" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Estadística del corpus</text><text x="710" y="260" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#91b9e3">P(solid | ice)</text><line x1="705" y1="287" x2="1080" y2="287" stroke="#d9c58f" stroke-width="2"/><text x="710" y="335" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#b8a5ee">P(solid | steam)</text><text x="710" y="445" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#e5e7eb">Una relación escalar</text><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">La diferencia de vectores contiene d componentes; el producto punto las resume en un escalar.</text></svg>