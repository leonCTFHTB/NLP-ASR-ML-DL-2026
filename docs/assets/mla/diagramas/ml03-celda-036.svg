<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Índice de hoja mediante bits"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">Índice de hoja mediante bits</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">ML Avanzado y DL · Clase 3 · Esquema didáctico</text><rect x="95" y="230" width="145" height="115" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="167" y="305" font-family="DejaVu Sans,sans-serif" font-size="42" font-weight="400" text-anchor="middle" fill="#91b9e3">1</text><text x="167" y="395" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#e5e7eb">2² = 4</text><rect x="285" y="230" width="145" height="115" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="357" y="305" font-family="DejaVu Sans,sans-serif" font-size="42" font-weight="400" text-anchor="middle" fill="#d9c58f">0</text><text x="357" y="395" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#e5e7eb">2¹ = 2</text><rect x="475" y="230" width="145" height="115" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="547" y="305" font-family="DejaVu Sans,sans-serif" font-size="42" font-weight="400" text-anchor="middle" fill="#b8a5ee">1</text><text x="547" y="395" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#e5e7eb">2⁰ = 1</text><line x1="640" y1="290" x2="720" y2="290" stroke="#91b9e3" stroke-width="4" marker-end="url(#arrow)"/><rect x="745" y="220" width="385" height="220" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="765" y="256" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Índice = 4 + 0 + 1 = 5</text><text x="775" y="370" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#d9c58f">W[5] = 45,0</text><text x="80" y="500" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#e5e7eb">Evaluar las condiciones cuesta O(d).</text><text x="80" y="540" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#e5e7eb">Consultar W[index] cuesta O(1).</text><text x="45" y="600" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#a8b0c1">La inferencia de T árboles cuesta aproximadamente O(Td) por muestra.</text></svg>