<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="1.1 · Una estructura lógica sobre un almacenamiento"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">1.1 · Una estructura lógica sobre un almacenamiento</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">Ejemplo: dos tensores pueden compartir los mismos datos y tener distintas formas.</text><rect x="55" y="165" width="510" height="195" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="75" y="201" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Tensor A</text><text x="85" y="250" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#91b9e3">shape (2, 3) · stride (3, 1)</text><rect x="635" y="165" width="510" height="195" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="655" y="201" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Tensor B</text><text x="665" y="250" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#b8a5ee">shape (3, 2) · stride (2, 1)</text><rect x="375" y="440" width="68" height="52" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="409.0" y="475.38" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#e5e7eb">10</text><rect x="449" y="440" width="68" height="52" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="483.0" y="475.38" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#e5e7eb">20</text><rect x="523" y="440" width="68" height="52" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="557.0" y="475.38" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#e5e7eb">30</text><rect x="597" y="440" width="68" height="52" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="631.0" y="475.38" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#e5e7eb">40</text><rect x="671" y="440" width="68" height="52" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="705.0" y="475.38" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#e5e7eb">50</text><rect x="745" y="440" width="68" height="52" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="779.0" y="475.38" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#e5e7eb">60</text><line x1="300" y1="360" x2="460" y2="430" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><line x1="890" y1="360" x2="740" y2="430" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="560" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#d9c58f">Un almacenamiento compartido · seis valores</text><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">La forma pertenece a cada tensor. Compartir almacenamiento no implica tener los mismos metadatos.</text></svg>