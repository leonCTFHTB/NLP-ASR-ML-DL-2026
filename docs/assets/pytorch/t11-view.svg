<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.4.1 · view y reshape: comprobar los strides"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.4.1 · view y reshape: comprobar los strides</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">El criterio no se reduce a preguntar si is_contiguous() es True.</text><rect x="65" y="160" width="500" height="355" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="85" y="196" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">view(nueva_forma)</text><text x="90" y="255" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#91b9e3">Solo devuelve una vista.</text><text x="90" y="315" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#e5e7eb">La forma y los strides deben</text><text x="90" y="355" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#e5e7eb">permitir el recorrido solicitado.</text><text x="90" y="440" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#d9c58f">Incompatible → RuntimeError</text><rect x="635" y="160" width="500" height="355" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="655" y="196" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">reshape(nueva_forma)</text><text x="660" y="255" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#91b9e3">Vista si es compatible.</text><text x="660" y="315" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#e5e7eb">Copia cuando la vista</text><text x="660" y="355" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#e5e7eb">no puede representar la forma.</text><text x="660" y="440" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#d9c58f">No asumir vista ni copia.</text><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">Contraejemplo: arange(12).reshape(3,4)[:,::2] no es contiguo y admite view(6), stride (2,).</text></svg>