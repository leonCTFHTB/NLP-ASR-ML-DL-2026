<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.1.3 · Decodificar 10,0 con IEEE 754"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.1.3 · Decodificar 10,0 con IEEE 754</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">0x41200000 = 01000001001000000000000000000000₂.</text><rect x="60" y="200" width="150" height="170" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="80" y="236" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Signo</text><text x="135.0" y="310" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#91b9e3">0</text><rect x="245" y="200" width="300" height="170" rx="14" fill="#191d26" stroke="#d9c58f" stroke-width="2"/><text x="265" y="236" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Exponente</text><text x="395.0" y="310" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#d9c58f">10000010₂ = 130</text><rect x="580" y="200" width="555" height="170" rx="14" fill="#191d26" stroke="#b8a5ee" stroke-width="2"/><text x="600" y="236" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Fracción</text><text x="857.5" y="310" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#b8a5ee">01000000000000000000000₂</text><text x="600" y="455" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="500" text-anchor="middle" fill="#e5e7eb">(−1)⁰ × (1 + 1/4) × 2¹³⁰⁻¹²⁷ = 1,25 × 8 = 10</text><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">La fórmula corresponde a valores normales; ceros, subnormales, infinitos y NaN requieren otros casos.</text></svg>