<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.6.1 · Elegir la operación de álgebra lineal"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.6.1 · Elegir la operación de álgebra lineal</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">Los rangos y las reglas de lote determinan la operación apropiada.</text><text x="70" y="180" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="600" text-anchor="start" fill="#d9c58f">Operación</text><text x="365" y="180" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="600" text-anchor="start" fill="#d9c58f">Entrada → salida</text><text x="830" y="180" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="600" text-anchor="start" fill="#d9c58f">Broadcasting de lote</text><text x="70" y="260" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#e5e7eb">dot</text><text x="365" y="260" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#e5e7eb">(K,), (K,) → escalar</text><text x="830" y="260" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#e5e7eb">No</text><line x1="65" y1="285" x2="1140" y2="285" stroke="#343b4b" stroke-width="2"/><text x="70" y="335" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#e5e7eb">mm</text><text x="365" y="335" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#e5e7eb">(M,K), (K,N) → (M,N)</text><text x="830" y="335" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#e5e7eb">No</text><line x1="65" y1="360" x2="1140" y2="360" stroke="#343b4b" stroke-width="2"/><text x="70" y="410" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#e5e7eb">bmm</text><text x="365" y="410" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#e5e7eb">(B,M,K), (B,K,N)</text><text x="830" y="410" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#e5e7eb">No</text><line x1="65" y1="435" x2="1140" y2="435" stroke="#343b4b" stroke-width="2"/><text x="70" y="485" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#91b9e3">matmul / @</text><text x="365" y="485" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#91b9e3">Vectores o matrices</text><text x="830" y="485" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#91b9e3">Sí, en ejes de lote</text><line x1="65" y1="510" x2="1140" y2="510" stroke="#343b4b" stroke-width="2"/><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">matmul no acepta operandos escalares 0D; los casos de vectores siguen sus reglas específicas.</text></svg>