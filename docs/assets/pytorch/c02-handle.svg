<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.1 · Copiar un handle no copia sus datos"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.1 · Copiar un handle no copia sus datos</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">at::Tensor b = a comparte la misma implementación de a.</text><rect x="65" y="185" width="310" height="135" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="85" y="221" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Handle a</text><rect x="65" y="380" width="310" height="135" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="85" y="416" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Handle b</text><rect x="690" y="255" width="440" height="205" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="710" y="291" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">TensorImpl compartido</text><text x="720" y="370" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#91b9e3">Una implementación</text><line x1="385" y1="250" x2="680" y2="310" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><line x1="385" y1="445" x2="680" y2="405" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">El handle puede estar en la pila, en el heap o dentro de otro objeto. clone() copia los datos.</text></svg>