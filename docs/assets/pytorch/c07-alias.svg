<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.3.1 · Vistas compartidas y copia explícita"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.3.1 · Vistas compartidas y copia explícita</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">No hay copy-on-write automático para las vistas ordinarias de este ejemplo.</text><rect x="65" y="160" width="490" height="345" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="85" y="196" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">a y v = a.view(2, 3)</text><rect x="95" y="245" width="64" height="59" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="127.0" y="284.65" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#e5e7eb">0</text><rect x="165" y="245" width="64" height="59" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="197.0" y="284.65" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#e5e7eb">1</text><rect x="235" y="245" width="64" height="59" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="267.0" y="284.65" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#e5e7eb">2</text><rect x="305" y="245" width="64" height="59" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="337.0" y="284.65" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#e5e7eb">3</text><rect x="375" y="245" width="64" height="59" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="407.0" y="284.65" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#e5e7eb">4</text><rect x="445" y="245" width="64" height="59" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="477.0" y="284.65" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#e5e7eb">5</text><text x="95" y="375" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#d9c58f">v[0, 0] = 99</text><text x="95" y="440" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#91b9e3">a[0] también pasa a valer 99.</text><rect x="645" y="160" width="490" height="345" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="665" y="196" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">c = a.clone()</text><rect x="675" y="245" width="64" height="59" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="707.0" y="284.65" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#e5e7eb">99</text><rect x="745" y="245" width="64" height="59" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="777.0" y="284.65" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#e5e7eb">1</text><rect x="815" y="245" width="64" height="59" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="847.0" y="284.65" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#e5e7eb">2</text><rect x="885" y="245" width="64" height="59" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="917.0" y="284.65" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#e5e7eb">3</text><rect x="955" y="245" width="64" height="59" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="987.0" y="284.65" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#e5e7eb">4</text><rect x="1025" y="245" width="64" height="59" rx="14" fill="#191d26" stroke="#91b9e3" stroke-width="2"/><text x="1057.0" y="284.65" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#e5e7eb">5</text><text x="675" y="375" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#d9c58f">c[0] = −1</text><text x="675" y="440" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#91b9e3">Los datos de a no cambian.</text><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">Autograd puede prohibir ciertas escrituras in-place; esa restricción no es copy-on-write.</text></svg>