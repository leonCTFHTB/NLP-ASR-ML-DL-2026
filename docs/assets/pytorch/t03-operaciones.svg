<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2 · Leer, transformar y calcular"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2 · Leer, transformar y calcular</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">Tres preguntas para cada operación: ¿qué forma?, ¿qué strides?, ¿comparte datos?</text><rect x="60" y="195" width="300" height="290" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="80" y="231" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Leer</text><text x="80" y="310" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#91b9e3">shape / stride / offset</text><text x="80" y="405" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#e5e7eb">Localizar un elemento</text><rect x="450" y="195" width="300" height="290" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="470" y="231" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Transformar</text><text x="470" y="310" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#91b9e3">view / reshape / transpose</text><text x="470" y="405" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#e5e7eb">Vista o copia según el caso</text><rect x="840" y="195" width="300" height="290" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="860" y="231" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Calcular</text><text x="860" y="310" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#91b9e3">suma / producto matricial</text><text x="860" y="405" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#e5e7eb">Resultado con valores nuevos</text><line x1="365" y1="340" x2="440" y2="340" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><line x1="755" y1="340" x2="830" y2="340" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">Las operaciones fuera de sitio del ejemplo generan un resultado; las vistas reutilizan sus datos.</text></svg>