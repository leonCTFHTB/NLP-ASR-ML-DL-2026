<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.4.2 · Añadir y quitar un eje unitario"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.4.2 · Añadir y quitar un eje unitario</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">unsqueeze(0) y squeeze(0) comparten el almacenamiento del ejemplo.</text><rect x="60" y="185" width="300" height="290" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="80" y="221" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Original</text><text x="85" y="300" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#91b9e3">shape (3, 4)</text><text x="85" y="375" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#e5e7eb">stride (4, 1)</text><rect x="450" y="185" width="300" height="290" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="470" y="221" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">unsqueeze(0)</text><text x="475" y="300" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#91b9e3">shape (1, 3, 4)</text><text x="475" y="375" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#e5e7eb">stride (12, 4, 1)</text><rect x="840" y="185" width="300" height="290" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="860" y="221" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">squeeze(0)</text><text x="865" y="300" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#91b9e3">shape (3, 4)</text><text x="865" y="375" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#e5e7eb">stride (4, 1)</text><line x1="365" y1="330" x2="440" y2="330" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><line x1="755" y1="330" x2="830" y2="330" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">squeeze() sin dim elimina todos los ejes de tamaño 1, incluido el lote cuando batch_size = 1.</text></svg>