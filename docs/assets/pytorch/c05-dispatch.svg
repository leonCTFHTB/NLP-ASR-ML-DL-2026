<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.2.2 · El dispatcher selecciona una implementación"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.2.2 · El dispatcher selecciona una implementación</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">Las claves del tensor se combinan con estado local y prioridades del despacho.</text><rect x="55" y="170" width="300" height="155" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="75" y="206" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Tensores</text><text x="73" y="275" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#91b9e3">backend · layout · claves</text><rect x="55" y="380" width="300" height="155" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="75" y="416" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Estado local</text><text x="73" y="485" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#91b9e3">modos incluidos / excluidos</text><rect x="455" y="270" width="300" height="155" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="475" y="306" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Dispatcher</text><text x="473" y="375" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#91b9e3">conjunto efectivo y prioridad</text><rect x="850" y="270" width="300" height="155" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="870" y="306" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Kernel registrado</text><text x="868" y="375" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#91b9e3">CPU / CUDA / Autograd / …</text><line x1="360" y1="245" x2="445" y2="310" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><line x1="360" y1="455" x2="445" y2="380" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><line x1="760" y1="345" x2="840" y2="345" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">El despacho no se reduce a un AND/OR ni permite prometer una latencia universal en nanosegundos.</text></svg>