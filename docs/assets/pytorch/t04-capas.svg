<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="2.1.1 · Capas de un tensor denso"><rect width="1200" height="650" rx="20" fill="#111318"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91b9e3"/></marker></defs><text x="45" y="60" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#b8a5ee">2.1.1 · Capas de un tensor denso</text><text x="45" y="102" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a8b0c1">El descriptor, el almacenamiento y el bloque de datos cumplen funciones distintas.</text><rect x="70" y="180" width="450" height="140" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="90" y="216" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">at::Tensor / TensorBase</text><text x="90" y="280" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#e5e7eb">Handle C++ con propiedad compartida</text><rect x="70" y="365" width="450" height="140" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="90" y="401" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">c10::TensorImpl</text><text x="90" y="465" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#e5e7eb">Forma, strides, offset y estado</text><rect x="690" y="180" width="450" height="140" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="710" y="216" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">c10::StorageImpl</text><text x="710" y="280" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#e5e7eb">Datos, capacidad y asignador</text><rect x="690" y="365" width="450" height="140" rx="14" fill="#191d26" stroke="#343b4b" stroke-width="2"/><text x="710" y="401" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#d9c58f">Bloque de datos</text><text x="710" y="465" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#e5e7eb">CPU, CUDA u otro backend</text><line x1="295" y1="325" x2="295" y2="355" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><line x1="525" y1="430" x2="680" y2="250" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><line x1="915" y1="325" x2="915" y2="355" stroke="#91b9e3" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="614" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a8b0c1">El objeto Python es otra envoltura. Los punteros representan direcciones virtuales del proceso.</text></svg>