<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Restar logaritmos equivale a dividir valores</title><desc id="desc">Un ejemplo escalar con a=log 8 y b=log 2 conecta diferencia y cociente.</desc><defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91b9e3"/></marker><marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9c58f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ed2bb"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7a2ed"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ed9d9d"/></marker><marker id="a-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#acb8cc"/></marker></defs><rect width="1400" height="760" rx="18" fill="#191d26"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="58" font-size="32" fill="#d9c58f" text-anchor="start">Restar logaritmos equivale a dividir valores</text><rect x="50" y="210" width="290" height="80" rx="9" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="195.0" y="258.0" font-size="24" fill="#91b9e3" text-anchor="middle">a = ln 8</text><polyline points="340,250 380,250" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><rect x="385" y="210" width="290" height="80" rx="9" fill="#222733" stroke="#b7a2ed" stroke-width="2"/><text x="530.0" y="258.0" font-size="24" fill="#b7a2ed" text-anchor="middle">b = ln 2</text><polyline points="675,250 715,250" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><rect x="720" y="210" width="290" height="80" rx="9" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="865.0" y="258.0" font-size="24" fill="#8ed2bb" text-anchor="middle">a − b = ln 4</text><polyline points="1010,250 1050,250" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><rect x="1055" y="210" width="290" height="80" rx="9" fill="#222733" stroke="#d9c58f" stroke-width="2"/><text x="1200.0" y="258.0" font-size="24" fill="#d9c58f" text-anchor="middle">exp → 4</text><rect x="50" y="460" width="290" height="80" rx="9" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="195.0" y="508.0" font-size="24" fill="#91b9e3" text-anchor="middle">exp(a) = 8</text><polyline points="340,500 380,500" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><rect x="385" y="460" width="290" height="80" rx="9" fill="#222733" stroke="#b7a2ed" stroke-width="2"/><text x="530.0" y="508.0" font-size="24" fill="#b7a2ed" text-anchor="middle">exp(b) = 2</text><polyline points="675,500 715,500" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><rect x="720" y="460" width="290" height="80" rx="9" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="865.0" y="508.0" font-size="24" fill="#8ed2bb" text-anchor="middle">8 / 2</text><polyline points="1010,500 1050,500" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><rect x="1055" y="460" width="290" height="80" rx="9" fill="#222733" stroke="#d9c58f" stroke-width="2"/><text x="1200.0" y="508.0" font-size="24" fill="#d9c58f" text-anchor="middle">resultado: 4</text><line x1="1200" y1="300" x2="1200" y2="455" stroke="#d9c58f" stroke-width="3" stroke-dasharray="7 6"/><text x="1230" y="390" font-size="32" fill="#d9c58f" text-anchor="start">=</text><text x="50" y="716" font-size="21" fill="#acb8cc" text-anchor="start">Las dos rutas dan el mismo escalar. Ninguna de las dos es una normalización softmax por sí sola.</text></svg>