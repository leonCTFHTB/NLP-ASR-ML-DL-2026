<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">De ventanas de texto a una matriz de conteos</title><desc id="desc">Una oración aporta pares observados, que se acumulan en una matriz centro-contexto.</desc><defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91b9e3"/></marker><marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9c58f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ed2bb"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7a2ed"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ed9d9d"/></marker><marker id="a-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#acb8cc"/></marker></defs><rect width="1400" height="760" rx="18" fill="#191d26"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="58" font-size="32" fill="#d9c58f" text-anchor="start">De ventanas de texto a una matriz de conteos</text><rect x="60" y="160" width="180" height="65" rx="9" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="150.0" y="200.5" font-size="24" fill="#91b9e3" text-anchor="middle">el</text><rect x="270" y="160" width="180" height="65" rx="9" fill="#222733" stroke="#d9c58f" stroke-width="2"/><text x="360.0" y="200.5" font-size="24" fill="#d9c58f" text-anchor="middle">gato</text><rect x="480" y="160" width="180" height="65" rx="9" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="570.0" y="200.5" font-size="24" fill="#91b9e3" text-anchor="middle">come</text><rect x="690" y="160" wid