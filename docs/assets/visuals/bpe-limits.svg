<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">BPE: reemplazar un par adyacente por una unidad</title><desc id="desc">Una secuencia de caracteres muestra dos fusiones sucesivas durante la tokenización.</desc><defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91b9e3"/></marker><marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9c58f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ed2bb"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7a2ed"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ed9d9d"/></marker><marker id="a-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#acb8cc"/></marker></defs><rect width="1400" height="760" rx="18" fill="#191d26"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="58" font-size="32" fill="#d9c58f" text-anchor="start">BPE: reemplazar un par adyacente por una unidad</text><text x="60" y="210" font-size="25" fill="#d9c58f" text-anchor="start">Unidades iniciales</text><rect x="520" y="170" width="150" height="75" rx="9" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="595.0" y="215.5" font-size="24" fill="#91b9e3" text-anchor="middle">g</text><rect x="700" y="170" width="150" height="75" rx="9" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="775.0" y="215.5" font-size="24" fill="#91b9e3" text-anchor="middle">a</text><rect x="880" y="170" width="150" height="75" rx="9" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="955.0" y="215.5" font-size="24" fill="#91b9e3" text-anchor="middle">t</text><rect x="1060" y="170" width="150" height="75" rx="9" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="1135.0" y="215.5" font-size="24" fill="#91b9e3" text-anchor="middle">o</text><polyline points="780,255 780,320" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><text x="60" y="380" font-size="25" fill="#d9c58f" text-anchor="start">Fusión 1: g + a</text><rect x="520" y="340" width="150" height="75" rx="9" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="595.0" y="385.5" font-size="24" fill="#8ed2bb" text-anchor="middle">ga</text><rect x="700" y="340" width="150" height="75" rx="9" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="775.0" y="385.5" font-size="24" fill="#8ed2bb" text-anchor="middle">t</text><rect x="880" y="340" width="150" height="75" rx="9" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="955.0" y="385.5" font-size="24" fill="#8ed2bb" text-anchor="middle">o</text><polyline points="780,425 780,490" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><text x="60" y="550" font-size="25" fill="#d9c58f" text-anchor="start">Fusión 2: ga + t</text><rect x="520" y="510" width="150" height="75" rx="9" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="595.0" y="555.5" font-size="24" fill="#8ed2bb" text-anchor="middle">gat</text><rect x="700" y="510" width="150" height="75" rx="9" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="775.0" y="555.5" font-size="24" fill="#8ed2bb" text-anchor="middle">o</text><text x="50" y="716" font-size="21" fill="#acb8cc" text-anchor="start">Fusiones hipotéticas para mostrar el mecanismo; no se atribuyen a un tokenizador entrenado concreto.</text></svg>