<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Fragmentos compartidos, vector compuesto</title><desc id="desc">Dos palabras comparten un n-grama que apunta a un bucket de parámetros.</desc><defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91b9e3"/></marker><marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9c58f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ed2bb"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7a2ed"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ed9d9d"/></marker><marker id="a-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#acb8cc"/></marker></defs><rect width="1400" height="760" rx="18" fill="#191d26"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="58" font-size="32" fill="#d9c58f" text-anchor="start">Fragmentos compartidos, vector compuesto</text><rect x="70" y="170" width="220" height="70" rx="9" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="180.0" y="213.0" font-size="24" fill="#91b9e3" text-anchor="middle">gato</text><rect x="70" y="460" width="220" height="70" rx="9" fill="#222733" stroke="#b7a2ed" stroke-width="2"/><text x="180.0" y="503.0" font-size="24" fill="#b7a2ed" text-anchor="middle">gatos</text><rect x="490" y="130" width="180" height="70" rx="9" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="580.0" y="173.0" font-size="24" fill="#8ed2bb" text-anchor="middle">&lt;ga</text><rect x="490" y="300" width="180" height="70" rx="9" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="580.0" y="343.0" font-size="24" fill="#8ed2bb" text-anchor="middle">gat</text><rect x="490" y="520" width="180" height="70" rx="9" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="580.0" y="563.0" font-size="24" fill="#8ed2bb" text-anchor="middle">tos</text><polyline points="290,205 385,205 385,165 490,165" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><polyline points="290,205 385,205 385,335 490,335" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><polyline points="290,495 385,495 385,335 490,335" fill="none" stroke="#b7a2ed" stroke-width="3.5" marker-end="url(#a-purple)"/><polyline points="290,495 385,495 385,555 490,555" fill="none" stroke="#b7a2ed" stroke-width="3.5" marker-end="url(#a-purple)"/><polyline points="670,335 805,335" fill="none" stroke="#8ed2bb" stroke-width="3.5" marker-end="url(#a-green)"/><rect x="825" y="270" width="220" height="130" rx="9" fill="#222733" stroke="#d9c58f" stroke-width="2"/><text x="935.0" y="343.0" font-size="24" fill="#d9c58f" text-anchor="middle">hash → bucket</text><polyline points="1045,335 1145,335" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><text x="1155" y="280" font-size="24" fill="#d9c58f" text-anchor="start">parámetros</text><rect x="1155" y="302" width="55" height="55" rx="2" fill="#222733" stroke="#d9c58f" stroke-width="2"/><text x="1182.0" y="337.0" font-size="20" fill="#d9c58f" text-anchor="middle">0.4</text><rect x="1213" y="302" width="55" height="55" rx="2" fill="#222733" stroke="#d9c58f" stroke-width="2"/><text x="1240.0" y="337.0" font-size="20" fill="#d9c58f" text-anchor="middle">0.7</text><text x="50" y="716" font-size="21" fill="#acb8cc" text-anchor="start">Solo se muestran algunos n-gramas. «gat» se comparte; el hashing también permite colisiones entre fragmentos distintos.</text></svg>