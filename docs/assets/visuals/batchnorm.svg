<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Normalizar por canal y aplicar escala y sesgo</title><desc id="desc">Puntos de un canal atraviesan una normalización y una transformación afín.</desc><defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91b9e3"/></marker><marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9c58f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ed2bb"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7a2ed"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ed9d9d"/></marker><marker id="a-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#acb8cc"/></marker></defs><rect width="1400" height="760" rx="18" fill="#191d26"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="58" font-size="32" fill="#d9c58f" text-anchor="start">Normalizar por canal y aplicar escala y sesgo</text><text x="60" y="170" font-size="27" fill="#91b9e3" text-anchor="start">Un canal: 4 valores</text><text x="60" y="278" font-size="24" fill="#d9c58f" text-anchor="start">x</text><rect x="60" y="300" width="62" height="62" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="90.5" y="338.5" font-size="20" fill="#91b9e3" text-anchor="middle">1</text><rect x="125" y="300" width="62" height="62" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="155.5" y="338.5" font-size="20" fill="#91b9e3" text-anchor="middle">2</text><rect x="190" y="300" width="62" height="62" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="220.5" y="338.5" font-size="20" fill="#91b9e3" text-anchor="middle">3</text><rect x="255" y="300" width="62" height="62" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="285.5" y="338.5" font-size="20" fill="#91b9e3" text-anchor="middle">4</text><polyline points="350,333 460,333" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><rect x="480" y="260" width="330" height="140" rx="9" fill="#222733" stroke="#d9c58f" stroke-width="2"/><text x="645.0" y="338.0" font-size="24" fill="#d9c58f" text-anchor="middle">(x − μ) / √(var + ε)</text><text x="480" y="470" font-size="25" fill="#d9c58f" text-anchor="start">μ=2.5; var=1.25</text><polyline points="810,333 910,333" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><text x="930" y="278" font-size="24" fill="#d9c58f" text-anchor="start">x̂ (ε=0 para ilustrar)</text><rect x="930" y="300" width="92" height="92" rx="2" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="975.5" y="353.5" font-size="20" fill="#8ed2bb" text-anchor="middle">-1.3</text><rect x="1025" y="300" width="92" height="92" rx="2" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="1070.5" y="353.5" font-size="20" fill="#8ed2bb" text-anchor="middle">-0.45</text><rect x="1120" y="300" width="92" height="92" rx="2" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="1165.5" y="353.5" font-size="20" fill="#8ed2bb" text-anchor="middle">0.45</text><rect x="1215" y="300" width="92" height="92" rx="2" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="1260.5" y="353.5" font-size="20" fill="#8ed2bb" text-anchor="middle">1.3</text><polyline points="1115,410 1115,520" fill="none" stroke="#8ed2bb" stroke-width="3.5" marker-end="url(#a-green)"/><rect x="940" y="540" width="330" height="80" rx="9" fill="#222733" stroke="#b7a2ed" stroke-width="2"/><text x="1105.0" y="588.0" font-size="24" fill="#b7a2ed" text-anchor="middle">γ x̂ + β</text><text x="50" y="716" font-size="21" fill="#acb8cc" text-anchor="start">En el cálculo real se añade epsilon; BatchNorm2d agrega el batch y las posiciones espaciales por canal.</text></svg>