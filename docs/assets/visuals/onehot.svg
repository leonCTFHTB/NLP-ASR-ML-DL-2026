<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Una consulta selecciona una fila del embedding</title><desc id="desc">Un indicador one-hot destaca una fila de una tabla de tres tokens.</desc><defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91b9e3"/></marker><marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9c58f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ed2bb"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7a2ed"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ed9d9d"/></marker><marker id="a-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#acb8cc"/></marker></defs><rect width="1400" height="760" rx="18" fill="#191d26"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="58" font-size="32" fill="#d9c58f" text-anchor="start">Una consulta selecciona una fila del embedding</text><text x="80" y="268" font-size="24" fill="#d9c58f" text-anchor="start">Token con índice 1</text><rect x="80" y="290" width="61" height="61" rx="2" fill="#222733" stroke="#d9c58f" stroke-width="2"/><text x="110.0" y="328.0" font-size="20" fill="#d9c58f" text-anchor="middle">0</text><rect x="144" y="290" width="61" height="61" rx="2" fill="#222733" stroke="#d9c58f" stroke-width="2"/><text x="174.0" y="328.0" font-size="20" fill="#d9c58f" text-anchor="middle">1</text><rect x="208" y="290" width="61" height="61" rx="2" fill="#222733" stroke="#d9c58f" stroke-width="2"/><text x="238.0" y="328.0" font-size="20" fill="#d9c58f" text-anchor="middle">0</text><polyline points="300,325 460,325" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><text x="500" y="198" font-size="24" fill="#d9c58f" text-anchor="start">Tabla E (3×2)</text><rect x="500" y="220" width="87" height="87" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="543.0" y="271.0" font-size="20" fill="#91b9e3" text-anchor="middle">0.2</text><rect x="590" y="220" width="87" height="87" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="633.0" y="271.0" font-size="20" fill="#91b9e3" text-anchor="middle">-0.1</text><rect x="500" y="310" width="87" height="87" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="543.0" y="361.0" font-size="20" fill="#91b9e3" text-anchor="middle">0.3</text><rect x="590" y="310" width="87" height="87" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="633.0" y="361.0" font-size="20" fill="#91b9e3" text-anchor="middle">0.8</text><rect x="500" y="400" width="87" height="87" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="543.0" y="451.0" font-size="20" fill="#91b9e3" text-anchor="middle">-0.4</text><rect x="590" y="400" width="87" height="87" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="633.0" y="451.0" font-size="20" fill="#91b9e3" text-anchor="middle">0.6</text><rect x="498" y="308" width="180" height="88" rx="0" fill="none" stroke="#d9c58f" stroke-width="2"/><polyline points="710,355 925,355" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><text x="970" y="300" font-size="24" fill="#d9c58f" text-anchor="start">Embedding E[1]</text><rect x="970" y="322" width="61" height="61" rx="2" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="1000.0" y="360.0" font-size="20" fill="#8ed2bb" text-anchor="middle">0.3</text><rect x="1034" y="322" width="61" height="61" rx="2" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="1064.0" y="360.0" font-size="20" fill="#8ed2bb" text-anchor="middle">0.8</text><text x="50" y="716" font-size="21" fill="#acb8cc" text-anchor="start">Consultar la fila evita materializar el one-hot. Los valores de E son ilustrativos, no resultados entrenados.</text></svg>