<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Una mariposa FFT: dos entradas, dos salidas</title><desc id="desc">Diagrama de la combinación de DFT pares e impares para cuatro muestras.</desc><defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91b9e3"/></marker><marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9c58f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ed2bb"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7a2ed"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ed9d9d"/></marker><marker id="a-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#acb8cc"/></marker></defs><rect width="1400" height="760" rx="18" fill="#191d26"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="58" font-size="32" fill="#d9c58f" text-anchor="start">Una mariposa FFT: dos entradas, dos salidas</text><text x="60" y="118" font-size="24" fill="#d9c58f" text-anchor="start">1 · Muestras x[n]</text><rect x="60" y="140" width="61" height="61" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="90.0" y="178.0" font-size="20" fill="#91b9e3" text-anchor="middle">1</text><rect x="124" y="140" width="61" height="61" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="154.0" y="178.0" font-size="20" fill="#91b9e3" text-anchor="middle">2</text><rect x="188" y="140" width="61" height="61" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="218.0" y="178.0" font-size="20" fill="#91b9e3" text-anchor="middle">3</text><rect x="252" y="140" width="61" height="61" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="282.0" y="178.0" font-size="20" fill="#91b9e3" text-anchor="middle">4</text><polyline points="185,210 185,270" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><text x="60" y="288" font-size="24" fill="#d9c58f" text-anchor="start">Índices pares</text><rect x="60" y="310" width="61" height="61" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="90.0" y="348.0" font-size="20" fill="#91b9e3" text-anchor="middle">1</text><rect x="124" y="310" width="61" height="61" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="154.0" y="348.0" font-size="20" fill="#91b9e3" text-anchor="middle">3</text><text x="60" y="448" font-size="24" fill="#d9c58f" text-anchor="start">Índices impares</text><rect x="60" y="470" width="61" height="61" rx="2" fill="#222733" stroke="#b7a2ed" stroke-width="2"/><text x="90.0" y="508.0" font-size="20" fill="#b7a2ed" text-anchor="middle">2</text><rect x="124" y="470" width="61" height="61" rx="2" fill="#222733" stroke="#b7a2ed" stroke-width="2"/><text x="154.0" y="508.0" font-size="20" fill="#b7a2ed" text-anchor="middle">4</text><polyline points="315,172 350,172 350,440 210,440 210,500 192,500" fill="none" stroke="#b7a2ed" stroke-width="3.5" marker-end="url(#a-purple)"/><polyline points="190,342 385,342 385,245 445,245" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><text x="285" y="320" font-size="23" fill="#91b9e3" text-anchor="middle">DFT₂</text><polyline points="190,505 445,505" fill="none" stroke="#b7a2ed" stroke-width="3.5" marker-end="url(#a-purple)"/><text x="320" y="480" font-size="23" fill="#b7a2ed" text-anchor="middle">DFT₂</text><text x="450" y="135" font-size="27" fill="#d9c58f" text-anchor="start">2 · Mariposa con N=4, k=1</text><rect x="450" y="210" width="190" height="70" rx="9" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="545.0" y="253.0" font-size="24" fill="#91b9e3" text-anchor="middle">E[1] = −2</text><rect x="450" y="470" width="190" height="70" rx="9" fill="#222733" stroke="#b7a2ed" stroke-width="2"/><text x="545.0" y="513.0" font-size="24" fill="#b7a2ed" text-anchor="middle">O[1] = −2</text><circle cx="750" cy="505" r="42" fill="#222733" stroke="#b7a2ed" stroke-width="3"/><text x="750" y="513" font-size="26" fill="#b7a2ed" text-anchor="middle">×</text><polyline points="640,505 708,505" fill="none" stroke="#b7a2ed" stroke-width="3.5" marker-end="url(#a-purple)"/><text x="750" y="590" font-size="23" fill="#b7a2ed" text-anchor="middle">W₄¹ = −i</text><polyline points="790,505 850,505" fill="none" stroke="#8ed2bb" stroke-width="3.5" marker-end="url(#a-green)"/><text x="850" y="560" font-size="23" fill="#8ed2bb" text-anchor="start">T = 2i</text><circle cx="1000" cy="245" r="35" fill="#222733" stroke="#d9c58f" stroke-width="3"/><text x="1000" y="253" font-size="26" fill="#d9c58f" text-anchor="middle">+</text><circle cx="1000" cy="505" r="35" fill="#222733" stroke="#d9c58f" stroke-width="3"/><text x="1000" y="513" font-size="26" fill="#d9c58f" text-anchor="middle">−</text><polyline points="640,245 965,245" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><polyline points="675,245 675,395 1000,395 1000,470" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><polyline points="875,505 910,505 910,320 1000,320 1000,280" fill="none" stroke="#8ed2bb" stroke-width="3.5" marker-end="url(#a-green)"/><polyline points="875,505 965,505" fill="none" stroke="#8ed2bb" stroke-width="3.5" marker-end="url(#a-green)"/><polyline points="1035,245 1110,245" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><rect x="1120" y="210" width="230" height="70" rx="9" fill="#222733" stroke="#d9c58f" stroke-width="2"/><text x="1235.0" y="253.0" font-size="24" fill="#d9c58f" text-anchor="middle">X[1]=−2+2i</text><polyline points="1035,505 1110,505" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><rect x="1120" y="470" width="230" height="70" rx="9" fill="#222733" stroke="#d9c58f" stroke-width="2"/><text x="1235.0" y="513.0" font-size="24" fill="#d9c58f" text-anchor="middle">X[3]=−2−2i</text><text x="1140" y="340" font-size="23" fill="#e5e7eb" text-anchor="start">Arriba: E + T</text><text x="1140" y="400" font-size="23" fill="#e5e7eb" text-anchor="start">Abajo: E − T</text><text x="50" y="716" font-size="21" fill="#acb8cc" text-anchor="start">Las ramas azules reutilizan E; las verdes reutilizan la misma T. El signo inferior resta T a E.</text></svg>