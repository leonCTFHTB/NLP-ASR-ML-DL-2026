<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Una matriz transforma todo el plano</title><desc id="desc">Un cuadrado se convierte en un rectángulo al aplicar una escala distinta por coordenada.</desc><defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91b9e3"/></marker><marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9c58f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ed2bb"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7a2ed"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ed9d9d"/></marker><marker id="a-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#acb8cc"/></marker></defs><rect width="1400" height="760" rx="18" fill="#191d26"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="58" font-size="32" fill="#d9c58f" text-anchor="start">Una matriz transforma todo el plano</text><polyline points="100,560 530,560" fill="none" stroke="#acb8cc" stroke-width="3.5" marker-end="url(#a-muted)"/><polyline points="100,560 100,210" fill="none" stroke="#acb8cc" stroke-width="3.5" marker-end="url(#a-muted)"/><polyline points="100,560 280,560 280,380 100,380 100,560" fill="none" stroke="#91b9e3" stroke-width="6"/><text x="100" y="170" font-size="26" fill="#d9c58f" text-anchor="start">Antes</text><polyline points="850,560 1280,560" fill="none" stroke="#acb8cc" stroke-width="3.5" marker-end="url(#a-muted)"/><polyline points="850,560 850,210" fill="none" stroke="#acb8cc" stroke-width="3.5" marker-end="url(#a-muted)"/><polyline points="850,560 1210,560 1210,470.0 850,470.0 850,560" fill="none" stroke="#8ed2bb" stroke-width="6"/><text x="850" y="170" font-size="26" fill="#d9c58f" text-anchor="start">Después: W=diag(2,0.5)</text><polyline points="560,380 760,380" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><text x="50" y="716" font-size="21" fill="#acb8cc" text-anchor="start">El origen se conserva. La escala horizontal se duplica y la vertical se reduce a la mitad.</text></svg>