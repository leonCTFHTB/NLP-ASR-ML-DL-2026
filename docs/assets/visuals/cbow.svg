e" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><rect x="1175" y="325" width="180" height="80" rx="9" fill="#222733" stroke="#b7a2ed" stroke-width="2"/><text x="1265.0" y="373.0" font-size="24" fill="#b7a2ed" text-anchor="middle">centro</text><text x="50" y="716" font-size="21" fill="#acb8cc" text-anchor="start">μ es la media de los contextos válidos. Las dos mitades representan tareas predictivas diferentes.</text></svg>