<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">De frecuencias lineales a bandas Mel</title><desc id="desc">Un espectro de potencia atraviesa filtros triangulares y produce potencias por banda antes del logaritmo.</desc><defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91b9e3"/></marker><marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9c58f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ed2bb"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7a2ed"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ed9d9d"/></marker><marker id="a-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#acb8cc"/></marker></defs><rect width="1400" height="760" rx="18" fill="#191d26"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="58" font-size="32" fill="#d9c58f" text-anchor="start">De frecuencias lineales a bandas Mel</text><text x="60" y="160" font-size="25" fill="#91b9e3" text-anchor="start">1 · Potencia por bin</text><line x1="60" y1="510.0" x2="390" y2="510.0" stroke="#acb8cc" stroke-width="3"/><rect x="68.25" y="487.0" width="24.75" height="23.0" rx="3" fill="#91b9e3" stroke="#91b9e3" stroke-width="2"/><text x="80.625" y="475.0" font-size="21" fill="#91b9e3" text-anchor="middle">0.1</text><rect x="109.5" y="326.0" width="24.75" height="184.0" rx="3" fill="#91b9e3" stroke="#91b9e3" stroke-width="2"/><text x="121.875" y="314.0" font-size="21" fill="#91b9e3" text-anchor="middle">0.8</text><rect x="150.75" y="418.0" width="24.75" height="92.0" rx="3" fill="#91b9e3" stroke="#91b9e3" stroke-width="2"/><text x="163.125" y="406.0" font-size="21" fill="#91b9e3" text-anchor="middle">0.4</text><rect x="192.0" y="464.0" width="24.75" height="46.0" rx="3" fill="#91b9e3" stroke="#91b9e3" stroke-width="2"/><text x="204.375" y="452.0" font-size="21" fill="#91b9e3" text-anchor="middle">0.2</text><rect x="233.25" y="349.0" width="24.75" height="161.0" rx="3" fill="#91b9e3" stroke="#91b9e3" stroke-width="2"/><text x="245.625" y="337.0" font-size="21" fill="#91b9e3" text-anchor="middle">0.7</text><rect x="274.5" y="441.0" width="24.75" height="69.0" rx="3" fill="#91b9e3" stroke="#91b9e3" stroke-width="2"/><text x="286.875" y="429.0" font-size="21" fill="#91b9e3" text-anchor="middle">0.3</text><rect x="315.75" y="487.0" width="24.75" height="23.0" rx="3" fill="#91b9e3" stroke="#91b9e3" stroke-width="2"/><text x="328.125" y="475.0" font-size="21" fill="#91b9e3" text-anchor="middle">0.1</text><rect x="357.0" y="395.0" width="24.75" height="115.0" rx="3" fill="#91b9e3" stroke="#91b9e3" stroke-width="2"/><text x="369.375" y="383.0" font-size="21" fill="#91b9e3" text-anchor="middle">0.5</text><polyline points="410,390 480,390" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><text x="510" y="160" font-size="25" fill="#b7a2ed" text-anchor="start">2 · Filtros triangulares</text><polyline points="520,510 565,270 610,510" fill="none" stroke="#91b9e3" stroke-width="4"/><polyline points="565,510 610,270 700,510" fill="none" stroke="#b7a2ed" stroke-width="4"/><polyline points="610,510 700,270 835,510" fill="none" stroke="#8ed2bb" stroke-width="4"/><polyline points="870,390 940,390" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><text x="970" y="160" font-size="25" fill="#8ed2bb" text-anchor="start">3 · Bandas → log</text><text x="980" y="288" font-size="24" fill="#d9c58f" text-anchor="start">Valores ilustrativos</text><rect x="980" y="31