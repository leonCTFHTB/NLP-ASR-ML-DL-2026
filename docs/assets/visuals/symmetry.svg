<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Conteos simétricos, parámetros distintos</title><desc id="desc">Una matriz de conteos simétrica no obliga a igualar las tablas aprendidas.</desc><defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91b9e3"/></marker><marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9c58f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ed2bb"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7a2ed"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ed9d9d"/></marker><marker id="a-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#acb8cc"/></marker></defs><rect width="1400" height="760" rx="18" fill="#191d26"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="58" font-size="32" fill="#d9c58f" text-anchor="start">Conteos simétricos, parámetros distintos</text><text x="100" y="218" font-size="24" fill="#d9c58f" text-anchor="start">Datos: X = Xᵀ</text><rect x="100" y="240" width="82" height="82" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="140.5" y="288.5" font-size="20" fill="#91b9e3" text-anchor="middle">0</text><rect x="185" y="240" width="82" height="82" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="225.5" y="288.5" font-size="20" fill="#91b9e3" text-anchor="middle">4</text><rect x="270" y="240" width="82" height="82" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="310.5" y="288.5" font-size="20" fil