<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Dos objetivos a partir de ventanas de contexto</title><desc id="desc">Un corpus se bifurca hacia pares predictivos o conteos agregados.</desc><defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91b9e3"/></marker><marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9c58f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ed2bb"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7a2ed"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ed9d9d"/></marker><marker id="a-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#acb8cc"/></marker></defs><rect width="1400" height="760" rx="18" fill="#191d26"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="58" font-size="32" fill="#d9c58f" text-anchor="start">Dos objetivos a partir de ventanas de contexto</text><rect x="540" y="145" width="320" height="80" rx="9" fill="#222733" stroke="#d9c58f" stroke-width="2"/><text x="700.0" y="193.0" font-size="24" fill="#d9c58f" text-anchor="middle">Corpus + ventanas</text><polyline points="700,225 700,300 340,300 340,360" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><polyline points="700,225 700,300 1060,300 1060,360" fill="none" stroke="#b7a2ed" stroke-width="3.5" marker-end="url(#a-purple)"/><rect x="140" y="365" width="400" height="90" rx="9" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="340.0" y="418.0" font-size="24" fill="#91b9e3" text-anchor="middle">Pares predictivos</text><rect x="860" y="365" width="400" height="90" rx="9" fill="#222733" stroke="#b7a2ed" stroke-width="2"/><text x="1060.0" y="418.0" font-size="24" fill="#b7a2ed" text-anchor="middle">Conteos Xᵢⱼ</text><polyline points="340,455 340,525" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><polyline points="1060,455 1060,525" fill="none" stroke="#b7a2ed" stroke-width="3.5" marker-end="url(#a-purple)"/><rect x="140" y="535" width="400" height="90" rx="9" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="340.0" y="588.0" font-size="24" fill="#91b9e3" text-anchor="middle">Word2Vec</text><rect x="860" y="535" width="400" height="90" rx="9" fill="#222733" stroke="#b7a2ed" stroke-width="2"/><text x="1060.0" y="588.0" font-size="24" fill="#b7a2ed" text-anchor="middle">GloVe</text><text x="50" y="716" font-size="21" fill="#acb8cc" text-anchor="start">La diferencia representada es el objetivo y cómo se organizan los datos, no un ranking universal de calidad.</text></svg>