ll="#91b9e3" text-anchor="middle">0.6</text><text x="254.99999999999997" y="538" font-size="21" fill="#e5e7eb" text-anchor="middle">B</text><rect x="341.3333333333333" y="419.0" width="74.0" height="81.0" rx="3" fill="#91b9e3" stroke="#91b9e3" stroke-width="2"/><text x="378.3333333333333" y="407.0" font-size="21" fill="#91b9e3" text-anchor="middle">0.3</text><text x="378.3333333333333" y="538" font-size="21" fill="#e5e7eb" text-anchor="middle">C</text><text x="70" y="160" font-size="26" fill="#91b9e3" text-anchor="start">Distribución sobre 3 opciones</text><polyline points="480,365 590,365" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><circle cx="650" cy="365" r="55" fill="#222733" stroke="#d9c58f" stroke-width="3"/><text x="650" y="373" font-size="26" fill="#d9c58f" text-anchor="middle">máx</text><polyline points="705,365 820,365" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><text x="840" y="213" font-size="24" fill="#d9c58f" text-anchor="start">Selección ilustrada</text><rect x="840" y="235" width="61" height="61" rx="2" fill="#222733" stroke="#d9c58f" stroke-width="2"/><text x="870.0" y="273.0" font-size="20" fill="#d9c58f" text-anchor="middle">0</text><rect x="904" y="235" width="61" height="61" rx="2" fill="#222733" stroke="#d9c58f" stroke-width="2"/><text x="934.0" y="273.0" font-size="20" fill="#d9c58f" text-anchor="middle">1</text><rect x="968" y="235" width="61" height="61" rx="2" fill="#222733" stroke="#d9c58f" stroke-width="2"/><text x="998.0" y="273.0" font-size="20" fill="#d9c58f" text-anchor="middle">0</text><polyline points="935,325 935,470" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><rect x="820" y="500" width="380" height="80" rx="9" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="1010.0" y="548.0" font-size="24" fill="#8ed2bb" text-anchor="middle">siguiente token = B</text><text x="50" y="716" font-size="21" fill="#acb8cc" text-anchor="start">Se muestra la regla greedy. Muestreo y beam search emplean otras decisiones de generación.</text></svg>