<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Ángulo y longitud son propiedades distintas</title><desc id="desc">Tres pares de flechas muestran cosenos uno, cero y menos uno.</desc><defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91b9e3"/></marker><marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9c58f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ed2bb"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7a2ed"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ed9d9d"/></marker><marker id="a-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#acb8cc"/></marker></defs><rect width="1400" height="760" rx="18" fill="#191d26"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="58" font-size="32" fill="#d9c58f" text-anchor="start">Ángulo y longitud son propiedades distintas</text><line x1="80" y1="455" x2="430" y2="455" stroke="#acb8cc" stroke-width="2"/><line x1="240" y1="245" x2="240" y2="590" stroke="#acb8cc" stroke-width="2"/><polyline points="240,455 380,455" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><polyline points="240,455 460,455" fill="none" stroke="#b7a2ed" stroke-width="3.5" marker-end="url(#a-purple)"/><text x="240" y="200" font-size="27" fill="#d9c58f" text-anchor="middle">cos θ = 1</text><line x1="520" y1="455" x2="870" y2="455" stroke="#acb8cc" stroke-width="2"/><line x1="680" y1="245" x2="680" y2="590" stroke="#acb8cc" stroke-width="2"/><polyline points="680,455 820,455" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><polyline points="680,455 680,255" fill="none" stroke="#b7a2ed" stroke-width="3.5" marker-end="url(#a-purple)"/><text x="680" y="200" font-size="27" fill="#d9c58f" text-anchor="middle">cos θ = 0</text><line x1="960" y1="455" x2="1310" y2="455" stroke="#acb8cc" stroke-width="2"/><line x1="1120" y1="245" x2="1120" y2="590" stroke="#acb8cc" stroke-width="2"/><polyline points="1120,455 1260,455" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><polyline points="1120,455 985,455" fill="none" stroke="#b7a2ed" stroke-width="3.5" marker-end="url(#a-purple)"/><text x="1120" y="200" font-size="27" fill="#d9c58f" text-anchor="middle">cos θ = −1</text><text x="50" y="716" font-size="21" fill="#acb8cc" text-anchor="start">Las flechas son vectores no nulos. Se compara dirección; la longitud puede ser distinta.</text></svg>