<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Las compuertas controlan la ruta de la celda</title><desc id="desc">Dos productos se reúnen en una suma para actualizar la celda de una LSTM.</desc><defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91b9e3"/></marker><marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9c58f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ed2bb"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7a2ed"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ed9d9d"/></marker><marker id="a-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#acb8cc"/></marker></defs><rect width="1400" height="760" rx="18" fill="#191d26"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="58" font-size="32" fill="#d9c58f" text-anchor="start">Las compuertas controlan la ruta de la celda</text><rect x="70" y="180" width="230" height="80" rx="9" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="185.0" y="228.0" font-size="24" fill="#91b9e3" text-anchor="middle">c anterior</text><polyline points="300,220 455,220" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><circle cx="500" cy="220" r="40" fill="#222733" stroke="#91b9e3" stroke-width="3"/><text x="500" y="228" font-size="26" fill="#91b9e3" text-anchor="middle">×</text><text x="500" y="145" font-size="28" fill="#91b9e3" text-anchor="middle">f</text><rect x="70" y="470" width="230" height="80" rx="9" fill="#222733" stroke="#b7a2ed" stroke-width="2"/><text x="185.0" y="518.0" font-size="24" fill="#b7a2ed" text-anchor="middle">propuesta g</text><polyline points="300,510 455,510" fill="none" stroke="#b7a2ed" stroke-width="3.5" marker-end="url(#a-purple)"/><circle cx="500" cy="510" r="40" fill="#222733" stroke="#b7a2ed" stroke-width="3"/><text x="500" y="518" font-size="26" fill="#b7a2ed" text-anchor="middle">×</text><text x="500" y="605" font-size="28" fill="#b7a2ed" text-anchor="middle">i</text><polyline points="540,220 740,220 740,365 805,365" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><polyline points="540,510 740,510 740,365 805,365" fill="none" stroke="#b7a2ed" stroke-width="3.5" marker-end="url(#a-purple)"/><circle cx="850" cy="365" r="45" fill="#222733" stroke="#d9c58f" stroke-width="3"/><text x="850" y="373" font-size="26" fill="#d9c58f" text-anchor="middle">+</text><polyline points="895,365 1010,365" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><rect x="1025" y="325" width="280" height="80" rx="9" fill="#222733" stroke="#d9c58f" stroke-width="2"/><text x="1165.0" y="373.0" font-size="24" fill="#d9c58f" text-anchor="middle">c nuevo</text><polyline points="1165,405 1165,475" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><rect x="1030" y="485" width="270" height="100" rx="9" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="1165.0" y="543.0" font-size="24" fill="#8ed2bb" text-anchor="middle">tanh → × o → h</text><text x="50" y="716" font-size="21" fill="#acb8cc" text-anchor="start">× representa producto elemento a elemento. La ruta de celda se actualiza con una suma controlada por compuertas.</text></svg>