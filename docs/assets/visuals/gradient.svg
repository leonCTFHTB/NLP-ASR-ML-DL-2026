<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Un paso cambia el producto punto</title><desc id="desc">Dos pasos en direcciones opuestas al cambiar el signo del residual de GloVe.</desc><defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91b9e3"/></marker><marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9c58f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ed2bb"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7a2ed"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ed9d9d"/></marker><marker id="a-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#acb8cc"/></marker></defs><rect width="1400" height="760" rx="18" fill="#191d26"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="58" font-size="32" fill="#d9c58f" text-anchor="start">Un paso cambia el producto punto</text><text x="90" y="155" font-size="27" fill="#91b9e3" text-anchor="start">u fijo = (1,0)</text><text x="140" y="235" font-size="29" fill="#8ed2bb" text-anchor="start">Residual negativo</text><polyline points="160,560 570,560" fill="none" stroke="#acb8cc" stroke-width="3.5" marker-end="url(#a-muted)"/><polyline points="160,560 160,290" fill="none" stroke="#acb8cc" stroke-width="3.5" marker-end="url(#a-muted)"/><polyline points="160,560 360,370" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><circle cx="360" cy="370" r="7" fill="#222733" stroke="#91b9e3" stroke-width="3"/><text x="360" y="378" font-size="26" fill="#91b9e3" text-anchor="middle"></text><polyline points="360,370 490,370" fill="none" stroke="#8ed2bb" stroke-width="3.5" marker-end="url(#a-green)"/><text x="280" y="630" font-size="26" fill="#8ed2bb" text-anchor="start">uᵀv aumenta</text><text x="830" y="235" font-size="29" fill="#ed9d9d" text-anchor="start">Residual positivo</text><polyline points="850,560 1260,560" fill="none" stroke="#acb8cc" stroke-width="3.5" marker-end="url(#a-muted)"/><polyline points="850,560 850,290" fill="none" stroke="#acb8cc" stroke-width="3.5" marker-end="url(#a-muted)"/><polyline points="850,560 1050,370" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><circle cx="1050" cy="370" r="7" fill="#222733" stroke="#91b9e3" stroke-width="3"/><text x="1050" y="378" font-size="26" fill="#91b9e3" text-anchor="middle"></text><polyline points="1050,370 920,370" fill="none" stroke="#ed9d9d" stroke-width="3.5" marker-end="url(#a-red)"/><text x="970" y="630" font-size="26" fill="#ed9d9d" text-anchor="start">uᵀv disminuye</text><text x="50" y="716" font-size="21" fill="#acb8cc" text-anchor="start">Solo se ilustra el paso de v con u fijo; las flechas horizontales muestran el signo de la actualización.</text></svg>