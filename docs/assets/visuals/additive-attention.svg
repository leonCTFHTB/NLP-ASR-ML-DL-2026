<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Dos proyecciones se reúnen antes de puntuar</title><desc id="desc">Dos ramas de query y key se proyectan, suman, pasan por tanh y se contraen a un score.</desc><defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91b9e3"/></marker><marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9c58f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ed2bb"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7a2ed"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ed9d9d"/></marker><marker id="a-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#acb8cc"/></marker></defs><rect width="1400" height="760" rx="18" fill="#191d26"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="58" font-size="32" fill="#d9c58f" text-anchor="start">Dos proyecciones se reúnen antes de puntuar</text><rect x="60" y="180" width="130" height="75" rx="9" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="125.0" y="225.5" font-size="24" fill="#91b9e3" text-anchor="middle">q</text><rect x="60" y="480" width="130" height="75" rx="9" fill="#222733" stroke="#b7a2ed" stroke-width="2"/><text x="125.0" y="525.5" font-size="24" fill="#b7a2ed" text-anchor="middle">k</text><polyline points="190,218 295,218" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><rect x="310" y="180" width="150" height="75" rx="9" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="385.0" y="225.5" font-size="24" fill="#91b9e3" text-anchor="middle">Wq</text><polyline points="460,218 580,218 580,367 630,367" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><polyline points="190,518 295,518" fill="none" stroke="#b7a2ed" stroke-width="3.5" marker-end="url(#a-purple)"/><rect x="310" y="480" width="150" height="75" rx="9" fill="#222733" stroke="#b7a2ed" stroke-width="2"/><text x="385.0" y="525.5" font-size="24" fill="#b7a2ed" text-anchor="middle">Wk</text><polyline points="460,518 580,518 580,367 630,367" fill="none" stroke="#b7a2ed" stroke-width="3.5" marker-end="url(#a-purple)"/><circle cx="670" cy="367" r="40" fill="#222733" stroke="#d9c58f" stroke-width="3"/><text x="670" y="375" font-size="26" fill="#d9c58f" text-anchor="middle">+</text><text x="670" y="460" font-size="23" fill="#d9c58f" text-anchor="middle">+ sesgo</text><polyline points="710,367 790,367" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><rect x="805" y="320" width="180" height="95" rx="9" fill="#222733" stroke="#8ed2bb" stroke-width="2"/><text x="895.0" y="375.5" font-size="24" fill="#8ed2bb" text-anchor="middle">tanh</text><polyline points="985,367 1050,367" fill="none" stroke="#8ed2bb" stroke-width="3.5" marker-end="url(#a-green)"/><rect x="1065" y="320" width="120" height="95" rx="9" fill="#222733" stroke="#b7a2ed" stroke-width="2"/><text x="1125.0" y="375.5" font-size="24" fill="#b7a2ed" text-anchor="middle">vᵀ</text><polyline points="1185,367 1250,367" fill="none" stroke="#b7a2ed" stroke-width="3.5" marker-end="url(#a-purple)"/><text x="1270" y="377" font-size="25" fill="#d9c58f" text-anchor="start">score</text><text x="50" y="716" font-size="21" fill="#acb8cc" text-anchor="start">Las formas indican el flujo de operaciones; los anchos deben ser compatibles con cada suma y producto.</text></svg>