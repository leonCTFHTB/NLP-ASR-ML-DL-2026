-size="20" fill="#91b9e3" text-anchor="middle">0.5</text><rect x="120" y="330" width="57" height="57" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="148.0" y="366.0" font-size="20" fill="#91b9e3" text-anchor="middle">0.1</text><rect x="60" y="390" width="57" height="57" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="88.0" y="426.0" font-size="20" fill="#91b9e3" text-anchor="middle">0.8</text><rect x="120" y="390" width="57" height="57" rx="2" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="148.0" y="426.0" font-size="20" fill="#91b9e3" text-anchor="middle">-0.2</text><polyline points="200,360 280,360 280,190 350,190" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><rect x="360" y="150" width="180" height="80" rx="9" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="450.0" y="198.0" font-size="24" fill="#91b9e3" text-anchor="middle">WQ</text><polyline points="540,190 650,190" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><rect x="660" y="150" width="120" height="80" rx="9" fill="#222733" stroke="#91b9e3" stroke-width="2"/><text x="720.0" y="198.0" font-size="24" fill="#91b9e3" text-anchor="middle">Q</text><polyline points="200,360 280,360 280,360 350,360" fill="none" stroke="#b7a2ed" stroke-width="3.5" marker-end="url(#a-purple)"/><rect x="360" y="320" width="180" height="80" rx="9" fill="#222733" stroke="#b7a2ed" stroke-width="2"/><text x="450.0" y="368.0" font-size="24" fill="#b7a2ed" text-anchor="middle">WK</text><polyline points="540,360 650,360" fill="none" stroke="#b7a2ed" stroke-width="3.5" marker-end="url(#a-purple)"/><rect x="660" y="320" width="120" height="80" rx="9" fill="#222733" stroke="#b7a2ed" stroke-width="2"/><text x="720.0" y="368.0" font-size="24" fill="#b7a2ed" text-anchor="middle">K</text><polyline points="200,360 280,360 280,530 350,530" fill="none" stroke="#8ed2bb" stroke-width="3.5" marker-end="url(#a-green)"/><rect x="360" y="490