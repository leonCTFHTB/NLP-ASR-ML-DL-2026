<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">La escala logarítmica hace visibles relaciones pequeñas</title><desc id="desc">Dos conjuntos de barras representan las mismas potencias en escala lineal y en dB relativos.</desc><defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91b9e3"/></marker><marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9c58f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ed2bb"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7a2ed"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ed9d9d"/></marker><marker id="a-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#acb8cc"/></marker></defs><rect width="1400" height="760" rx="18" fill="#191d26"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="58" font-size="32" fill="#d9c58f" text-anchor="start">La escala logarítmica hace visibles relaciones pequeñas</text><text x="70" y="170" font-size="27" fill="#91b9e3" text-anchor="start">Potencia lineal</text><line x1="70" y1="540.0" x2="550" y2="540.0" stroke="#acb8cc" stroke-width="3"/><rect x="102.0" y="285.4545454545455" width="96.0" height="254.5454545454545" rx="3" fill="#91b9e3" stroke="#91b9e3" stroke-width="2"/><text x="150.0" y="273.4545454545455" font-size="21" fill="#91b9e3" text-anchor="middle">1</text><text x="150.0" y="578" font-size="21" fill="#e5e7eb" text-anchor="middle">A</text><rect x="262.0" y="537.4545454545455" width="96.0" height="2.545454545454504" rx="3" fill="#91b9e3" stroke="#91b9e3" stroke-width="2"/><text x="310.0" y="525.4545454545455" font-size="21" fill="#91b9e3" text-anchor="middle">0.01</text><text x="310.0" y="578" font-size="21" fill="#e5e7eb" text-anchor="middle">B</text><rect x="422.0" y="539.9745454545455" width="96.0" height="2" rx="3" fill="#91b9e3" stroke="#91b9e3" stroke-width="2"/><text x="470.0" y="527.9745454545455" font-size="21" fill="#91b9e3" text-anchor="middle">0.0001</text><text x="470.0" y="578" font-size="21" fill="#e5e7eb" text-anchor="middle">C</text><polyline points="620,370 770,370" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><text x="695" y="275" font-size="25" fill="#d9c58f" text-anchor="middle">10 log₁₀</text><text x="850" y="170" font-size="27" fill="#8ed2bb" text-anchor="start">Nivel con referencia 1</text><line x1="850" y1="288.0" x2="1290" y2="288.0" stroke="#acb8cc" stroke-width="3"/><rect x="879.3333333333334" y="288.0" width="87.99999999999999" height="2" rx="3" fill="#8ed2bb" stroke="#8ed2bb" stroke-width="2"/><text x="923.3333333333334" y="276.0" font-size="21" fill="#8ed2bb" text-anchor="middle">0</text><text x="923.3333333333334" y="578" font-size="21" fill="#e5e7eb" text-anchor="middle">A</text><rect x="1026.0" y="288.0" width="87.99999999999999" height="112.0" rx="3" fill="#8ed2bb" stroke="#8ed2bb" stroke-width="2"/><text x="1070.0" y="428.0" font-size="21" fill="#8ed2bb" text-anchor="middle">-20</text><text x="1070.0" y="578" font-size="21" fill="#e5e7eb" text-anchor="middle">B</text><rect x="1172.6666666666665" y="288.0" width="87.99999999999999" height="224.0" rx="3" fill="#8ed2bb" stroke="#8ed2bb" stroke-width="2"/><text x="1216.6666666666665" y="540.0" font-size="21" fill="#8ed2bb" text-anchor="middle">-40</text><text x="1216.6666666666665" y="578" font-size="21" fill="#e5e7eb" text-anchor="middle">C</text><text x="50" y="716" font-size="21" fill="#acb8cc" text-anchor="start">Mismas potencias: 1 → 0 dB; 0.01 → −20 dB; 0.0001 → −40 dB. No se ha fijado una calibración acústica.</text></svg>