<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Una posición rota cada pareja de coordenadas</title><desc id="desc">Cuatro flechas de igual norma muestran rotaciones sucesivas de un vector fijo.</desc><defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91b9e3"/></marker><marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9c58f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ed2bb"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7a2ed"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ed9d9d"/></marker><marker id="a-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#acb8cc"/></marker></defs><rect width="1400" height="760" rx="18" fill="#191d26"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="58" font-size="32" fill="#d9c58f" text-anchor="start">Una posición rota cada pareja de coordenadas</text><circle cx="670" cy="420" r="220" fill="none" stroke="#acb8cc" stroke-dasharray="7 7" stroke-width="2"/><line x1="390" y1="420" x2="950" y2="420" stroke="#acb8cc" stroke-width="3"/><line x1="670" y1="140" x2="670" y2="700" stroke="#acb8cc" stroke-width="3"/><polyline points="670,420 890.0,420.0" fill="none" stroke="#91b9e3" stroke-width="3.5" marker-end="url(#a-blue)"/><text x="915.0" y="405.0" font-size="25" fill="#91b9e3" text-anchor="start">p=0</text><polyline points="670,420 860.5255888325765,310.0" fill="none" stroke="#8ed2bb" stroke-width="3.5" marker-end="url(#a-green)"/><text x="885.5255888325765" y="295.0" font-size="25" fill="#8ed2bb" text-anchor="start">p=1</text><polyline points="670,420 780.0,229.4744111674235" fill="none" stroke="#d9c58f" stroke-width="3.5" marker-end="url(#a-gold)"/><text x="805.0" y="214.4744111674235" font-size="25" fill="#d9c58f" text-anchor="start">p=2</text><polyline points="670,420 670.0,200.0" fill="none" stroke="#b7a2ed" stroke-width="3.5" marker-end="url(#a-purple)"/><text x="695.0" y="185.0" font-size="25" fill="#b7a2ed" text-anchor="start">p=3</text><text x="80" y="185" font-size="27" fill="#91b9e3" text-anchor="start">q=(1,0)</text><text x="80" y="240" font-size="27" fill="#91b9e3" text-anchor="start">θ=π/6</text><text x="1040" y="400" font-size="27" fill="#d9c58f" text-anchor="start">Misma norma</text><text x="50" y="716" font-size="21" fill="#acb8cc" text-anchor="start">Se cambia la posición manteniendo fijo el contenido de esta pareja de coordenadas.</text></svg>