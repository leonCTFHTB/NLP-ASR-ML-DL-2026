<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Comparar dos centros con el mismo contexto</title><desc id="desc">Dos series de barras y sus cocientes usan las cifras redondeadas de la ficha de GloVe.</desc><defs><marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91b9e3"/></marker><marker id="a-gold" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9c58f"/></marker><marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ed2bb"/></marker><marker id="a-purple" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b7a2ed"/></marker><marker id="a-red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ed9d9d"/></marker><marker id="a-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#acb8cc"/></marker></defs><rect width="1400" height="760" rx="18" fill="#191d26"/><style>text{font-family:DejaVu Sans,Arial,sans-serif}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="58" font-size="32" fill="#d9c58f" text-anchor="start">Comparar dos centros con el mismo contexto</text><text x="70" y="145" font-size="26" fill="#e5e7eb" text-anchor="start">Azul: P(k|ice)     Violeta: P(k|steam)</text><line x1="110" y1="510" x2="1290" y2="510" stroke="#acb8cc" stroke-width="3"/><text x="80" y="190" font-size="21" fill="#e5e7eb" text-anchor="start">10⁻²</text><text x="80" y="520" font-size="21" fill="#e5e7eb" text-anchor="start">10⁻⁵</text><rect x="165" y="375.73087189995294" width="52" height="134.26912810004703" rx="2" fill="#91b9e3" stroke="#91b9e3" stroke-width="2"/><rect x="235" y="474.0456185136683" width="52" height="35.9543814863317" rx="2" fill="#b7a2ed" stroke="#b7a2ed" stroke-width="2"/><text x="225" y="560" font-size="24" fill="#e5e7eb" text-anchor="middle">solid</text><text x="225" y="630" font-size="25" fill="#d9c58f" text-anchor="middle">ratio ≈ 8.64</text><rect x="455" y="423.94788676810384" width="52" height="86.05211323189617" rx="2" fill="#91b9e3" stroke="#91b9e3" stroke-width="2"/><rect x="525" y="311.33006671749956" width="52" height="198.66993328250044" rx="2" fill="#b7a2ed" stroke="#b7a2ed" stroke-width="2"/><text x="515" y="560" font-size="24" fill="#e5e7eb" text-anchor="middle">gas</text><text x="515" y="630" font-size="25" fill="#d9c58f" text-anchor="middle">ratio ≈ 0.0846</text><rect x="745" y="249.9022682544354" width="52" height="260.0977317455646" rx="2" fill="#91b9e3" stroke="#91b9e3" stroke-width="2"/><rect x="815" y="264.0456185136684" width="52" height="245.95438148633164" rx="2" fill="#b7a2ed" stroke="#b7a2ed" stroke-width="2"/><text x="805" y="560" font-size="24" fill="#e5e7eb" text-anchor="middle">water</text><text x="805" y="630" font-size="25" fill="#d9c58f" text-anchor="middle">ratio ≈ 1.36</text><rect x="1035" y="485.80286325528124" width="52" height="24.197136744718783" rx="2" fill="#91b9e3" stroke="#91b9e3" stroke-width="2"/><rect x="1105" y="483.1963869641528" width="52" height="26.803613035847178" rx="2" fill="#b7a2ed" stroke="#b7a2ed" stroke-width="2"/><text x="1095" y="560" font-size="24" fill="#e5e7eb" text-anchor="middle">fashion</text><text x="1095" y="630" font-size="25" fill="#d9c58f" text-anchor="middle">ratio ≈ 0.944</text><text x="50" y="716" font-size="21" fill="#acb8cc" text-anchor="start">Eje vertical logarítmico. Cocientes calculados con las probabilidades redondeadas de la ficha.</text></svg>