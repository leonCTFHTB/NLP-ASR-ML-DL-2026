<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 372" role="img"><rect width="100%" height="100%" rx="18" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:21px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="45" y="60" class="title">Sin posiciones ni máscara de orden: equivariancia</text><rect x="45.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="67.0" y="135">Entrada X</text><text class="line" x="67.0" y="181">Tokens: A, B, C</text><text class="line" x="67.0" y="219">Salida: zA, zB, zC</text><text class="line" x="67.0" y="257">Cada token combina valores</text><text class="line" x="67.0" y="295">mediante atención.</text><rect x="732.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="754.0" y="135">Entrada permutada P X</text><text class="line" x="754.0" y="181">Tokens: C, A, B</text><text class="line" x="754.0" y="219">Salida: zC, zA, zB</text><text class="line" x="754.0" y="257">Las filas cambian de lugar.</text><text class="line" x="754.0" y="295">SA(P X) = P SA(X)</text><text x="45" y="347" class="foot">Invariancia sería conservar idéntica salida. Una máscara causal fija cambia los supuestos.</text></svg>