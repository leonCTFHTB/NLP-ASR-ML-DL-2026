<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 372" role="img"><rect width="100%" height="100%" rx="18" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:21px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="45" y="60" class="title">DFT: magnitud, fase y frecuencia</text><rect x="45.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="67.0" y="135">Coeficientes complejos</text><text class="line" x="67.0" y="181">X[k] = Σₙ x[n] exp(−j2πkn/N)</text><text class="line" x="67.0" y="219">Magnitud: |X[k]|</text><text class="line" x="67.0" y="257">Fase: atan2(Im X, Re X)</text><text class="line" x="67.0" y="295">Potencia espectral: |X[k]|²</text><rect x="732.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="754.0" y="135">Bins</text><text class="line" x="754.0" y="181">Δf = Fₛ / N: separación de bins</text><text class="line" x="754.0" y="219">fₖ = k Fₛ/N hasta Nyquist.</text><text class="line" x="754.0" y="257">Los bins altos representan</text><text class="line" x="754.0" y="295">frecuencias negativas.</text><text x="45" y="347" class="foot">La resolución efectiva también depende de la duración de la ventana; añadir ceros no crea información.</text></svg>