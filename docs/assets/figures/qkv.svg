<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 372" role="img"><rect width="100%" height="100%" rx="18" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:21px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="45" y="60" class="title">Self-attention: tres proyecciones aprendidas</text><rect x="45.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="67.0" y="135">Comparar</text><text class="line" x="67.0" y="181">Q = X WQ</text><text class="line" x="67.0" y="219">K = X WK</text><text class="line" x="67.0" y="257">S = Q Kᵀ / √dₖ</text><text class="line" x="67.0" y="295">Sᵢⱼ = qᵢ · kⱼ / √dₖ</text><rect x="732.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="754.0" y="135">Mezclar</text><text class="line" x="754.0" y="181">V = X WV</text><text class="line" x="754.0" y="219">A = softmax por fila(S)</text><text class="line" x="754.0" y="257">Z = A V</text><text class="line" x="754.0" y="295">Z conserva una fila por consulta.</text><text x="45" y="347" class="foot">Las proyecciones se entrenan conjuntamente. Los pesos de atención no son etiquetas lingüísticas garantizadas.</text></svg>