<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 372" role="img"><rect width="100%" height="100%" rx="18" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:21px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="45" y="60" class="title">Self-attention y cross-attention</text><rect x="45.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="67.0" y="135">Self-attention</text><text class="line" x="67.0" y="181">Q, K y V se proyectan</text><text class="line" x="67.0" y="219">de la misma secuencia.</text><text class="line" x="67.0" y="257">En un decoder causal,</text><text class="line" x="67.0" y="295">se enmascara el futuro.</text><rect x="732.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="754.0" y="135">Cross-attention</text><text class="line" x="754.0" y="181">Q: estados del decoder.</text><text class="line" x="754.0" y="219">K y V: memoria del encoder.</text><text class="line" x="754.0" y="257">Longitudes de consultas</text><text class="line" x="754.0" y="295">y de memoria pueden diferir.</text><text x="45" y="347" class="foot">Esquema didáctico · las coordenadas y ejemplos no son resultados entrenados.</text></svg>