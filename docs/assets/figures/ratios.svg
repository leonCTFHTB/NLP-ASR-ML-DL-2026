<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 372" role="img"><rect width="100%" height="100%" rx="18" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:21px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="45" y="60" class="title">GloVe: dos centros y un contexto fijo</text><rect x="45.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="67.0" y="135">Contexto k</text><text class="line" x="67.0" y="181">solid</text><text class="line" x="67.0" y="219">gas</text><text class="line" x="67.0" y="257">water</text><text class="line" x="67.0" y="295">fashion</text><rect x="732.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="754.0" y="135">P(k|ice) / P(k|steam)</text><text class="line" x="754.0" y="181">1.9e−4 / 2.2e−5 ≈ 8.64</text><text class="line" x="754.0" y="219">6.6e−5 / 7.8e−4 ≈ 0.0846</text><text class="line" x="754.0" y="257">3.0e−3 / 2.2e−3 ≈ 1.36</text><text class="line" x="754.0" y="295">1.7e−5 / 1.8e−5 ≈ 0.944</text><text x="45" y="347" class="foot">Cifras redondeadas de Pennington et al. (2014), tabla 1. Los ratios publicados: 8.9, 0.085, 1.36 y 0.96.</text></svg>