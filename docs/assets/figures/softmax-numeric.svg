<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 398" role="img" aria-labelledby="title desc"><title id="title">Softmax: un ejemplo numérico verificable</title><desc id="desc">Puntuaciones y exponenciales: scores = [3.2, −1.5, 4.0] Restar el máximo conserva el softmax. scores − 4 = [−0.8, −5.5, 0] exp(scores − 4) ≈ [0.4493, 0.00409, 1] Normalización: La suma es aproximadamente 1.4534. Probabilidades ≈ [0.3092, 0.0028, 0.6880] La suma es 1, salvo redondeo. El eje indica qué candidatos se comparan.</desc><rect width="1440" height="398" rx="14" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:29px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:22px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="38" y="55" class="title">Softmax: un ejemplo numérico verificable</text><rect x="38" y="88" width="670" height="218" rx="9" fill="#222733" stroke="#3b4354"/><text x="60" y="129" class="head">Puntuaciones y exponenciales</text><text x="60" y="174" class="line">scores = [3.2, −1.5, 4.0]</text><text x="60" y="211" class="line">Restar el máximo conserva el softmax.</text><text x="60" y="248" class="line">scores − 4 = [−0.8, −5.5, 0]</text><text x="60" y="285" class="line">exp(scores − 4) ≈ [0.4493, 0.00409, 1]</text><rect x="732" y="88" width="670" height="218" rx="9" fill="#222733" stroke="#3b4354"/><text x="754" y="129" class="head">Normalización</text><text x="754" y="174" class="line">La suma es aproximadamente 1.4534.</text><text x="754" y="211" class="line">Probabilidades ≈ [0.3092, 0.0028, 0.6880]</text><text x="754" y="248" class="line">La suma es 1, salvo redondeo.</text><text x="754" y="285" class="line">El eje indica qué candidatos se comparan.</text><text x="38" y="356" class="foot">El eje del softmax determina qué conjunto de puntuaciones se normaliza.</text></svg>