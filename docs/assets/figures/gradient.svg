<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 372" role="img"><rect width="100%" height="100%" rx="18" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:21px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="45" y="60" class="title">El gradiente ajusta una puntuación; no atrae puntos</text><rect x="45.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="67.0" y="135">Residual negativo</text><text class="line" x="67.0" y="181">eᵢⱼ = predicción − log xᵢⱼ &lt; 0</text><text class="line" x="67.0" y="219">Con uⱼ fijo, el paso en vᵢ</text><text class="line" x="67.0" y="257">apunta en dirección +uⱼ.</text><text class="line" x="67.0" y="295">Aumenta el producto punto.</text><rect x="732.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="754.0" y="135">Residual positivo</text><text class="line" x="754.0" y="181">eᵢⱼ &gt; 0</text><text class="line" x="754.0" y="219">Con uⱼ fijo, el paso en vᵢ</text><text class="line" x="754.0" y="257">apunta en dirección −uⱼ.</text><text class="line" x="754.0" y="295">Disminuye el producto punto.</text><text x="45" y="347" class="foot">Descenso simple: Δvᵢ = −η 2 h(xᵢⱼ) eᵢⱼ uⱼ · AdaGrad reescala las coordenadas.</text></svg>