<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 372" role="img"><rect width="100%" height="100%" rx="18" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:21px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="45" y="60" class="title">La base de RoPE controla las frecuencias</text><rect x="45.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="67.0" y="135">Diseño</text><text class="line" x="67.0" y="181">θᵢ = base^(−2i/d)</text><text class="line" x="67.0" y="219">Una base mayor reduce</text><text class="line" x="67.0" y="257">algunas frecuencias angulares.</text><text class="line" x="67.0" y="295">i = 0 mantiene θ₀ = 1.</text><rect x="732.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="754.0" y="135">Alcance</text><text class="line" x="754.0" y="181">La elección depende del modelo</text><text class="line" x="754.0" y="219">y de su entrenamiento.</text><text class="line" x="754.0" y="257">Una base mayor por sí sola</text><text class="line" x="754.0" y="295">no amplía el contexto validado.</text><text x="45" y="347" class="foot">Esquema didáctico · las coordenadas y ejemplos no son resultados entrenados.</text></svg>