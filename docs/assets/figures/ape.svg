<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 372" role="img"><rect width="100%" height="100%" rx="18" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:21px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="45" y="60" class="title">La suma posicional cambia la representación</text><rect x="45.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="67.0" y="135">Entrada aprendida</text><text class="line" x="67.0" y="181">xₘ + pₘ combina contenido</text><text class="line" x="67.0" y="219">y posición absoluta.</text><text class="line" x="67.0" y="257">Puede cambiar norma y ángulo.</text><text class="line" x="67.0" y="295">No demuestra daño semántico.</text><rect x="732.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="754.0" y="135">Producto de atención</text><text class="line" x="754.0" y="181">qₘ = (xₘ + pₘ) WQ</text><text class="line" x="754.0" y="219">kₙ = (xₙ + pₙ) WK</text><text class="line" x="754.0" y="257">Aparecen términos cruzados.</text><text class="line" x="754.0" y="295">Se entrenan junto con el modelo.</text><text x="45" y="347" class="foot">Una visualización de vectores sintéticos no demuestra pérdida de calidad en un Transformer entrenado.</text></svg>