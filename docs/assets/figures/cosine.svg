<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 334" role="img"><rect width="100%" height="100%" rx="18" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:21px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="45" y="60" class="title">Similitud de coseno: geometría e interpretación</text><rect x="45.0" y="94" width="434.0" height="168" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="67.0" y="135">cos θ = 1</text><text class="line" x="67.0" y="181">Vectores no nulos paralelos.</text><text class="line" x="67.0" y="219">Misma dirección; pueden tener</text><text class="line" x="67.0" y="257">longitudes diferentes.</text><rect x="503.0" y="94" width="434.0" height="168" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="525.0" y="135">cos θ = 0</text><text class="line" x="525.0" y="181">Vectores ortogonales.</text><text class="line" x="525.0" y="219">No prueba independencia</text><text class="line" x="525.0" y="257">ni ausencia de relación.</text><rect x="961.0" y="94" width="434.0" height="168" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="983.0" y="135">cos θ = −1</text><text class="line" x="983.0" y="181">Direcciones opuestas.</text><text class="line" x="983.0" y="219">No demuestra antonimia:</text><text class="line" x="983.0" y="257">el significado depende del modelo.</text><text x="45" y="309" class="foot">u·v = ‖u‖ ‖v‖ cos θ · producto punto y coseno no son equivalentes sin normalización.</text></svg>