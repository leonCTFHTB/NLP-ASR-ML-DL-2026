<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 372" role="img"><rect width="100%" height="100%" rx="18" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:21px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="45" y="60" class="title">FFT Radix-2: dos mitades y una mariposa</text><rect x="45.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="67.0" y="135">Separar</text><text class="line" x="67.0" y="181">N = 2ˢ muestras.</text><text class="line" x="67.0" y="219">E[k]: DFT de índices pares.</text><text class="line" x="67.0" y="257">O[k]: DFT de índices impares.</text><text class="line" x="67.0" y="295">Wₙᵏ = exp(−j2πk/N)</text><rect x="732.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="754.0" y="135">Combinar</text><text class="line" x="754.0" y="181">X[k] = E[k] + Wₙᵏ O[k]</text><text class="line" x="754.0" y="219">X[k+N/2] = E[k] − Wₙᵏ O[k]</text><text class="line" x="754.0" y="257">log₂ N etapas.</text><text class="line" x="754.0" y="295">Coste O(N log N).</text><text x="45" y="347" class="foot">Una FFT es un algoritmo para la DFT, no una transformada distinta.</text></svg>