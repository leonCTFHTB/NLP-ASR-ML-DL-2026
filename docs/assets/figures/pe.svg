<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 372" role="img"><rect width="100%" height="100%" rx="18" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:21px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="45" y="60" class="title">Posiciones sinusoidales: pares intercalados</text><rect x="45.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="67.0" y="135">Dimensiones 2i y 2i+1</text><text class="line" x="67.0" y="181">ωᵢ = 10000^(−2i/d)</text><text class="line" x="67.0" y="219">PE(pos, 2i) = sin(pos ωᵢ)</text><text class="line" x="67.0" y="257">PE(pos, 2i+1) = cos(pos ωᵢ)</text><text class="line" x="67.0" y="295">Misma frecuencia por pareja.</text><rect x="732.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="754.0" y="135">Periodos</text><text class="line" x="754.0" y="181">λᵢ = 2π / ωᵢ</text><text class="line" x="754.0" y="219">Con d = 6:</text><text class="line" x="754.0" y="257">λ₀ ≈ 6.28; λ₁ ≈ 135.37</text><text class="line" x="754.0" y="295">λ₂ ≈ 2916.40 posiciones.</text><text x="45" y="347" class="foot">Esquema didáctico · las coordenadas y ejemplos no son resultados entrenados.</text></svg>