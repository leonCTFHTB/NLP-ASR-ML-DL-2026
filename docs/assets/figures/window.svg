<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 372" role="img"><rect width="100%" height="100%" rx="18" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:21px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="45" y="60" class="title">Ventaneo: reducir fuga a cambio de ensanchar el pico</text><rect x="45.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="67.0" y="135">Hann simétrica</text><text class="line" x="67.0" y="181">w[n] = 0.5 − 0.5 cos(2πn/(N−1))</text><text class="line" x="67.0" y="219">Extremos iguales a cero.</text><text class="line" x="67.0" y="257">Atenúa los lóbulos laterales.</text><text class="line" x="67.0" y="295">La fuga no desaparece.</text><rect x="732.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="754.0" y="135">Hamming simétrica</text><text class="line" x="754.0" y="181">w[n] = 0.54 − 0.46 cos(2πn/(N−1))</text><text class="line" x="754.0" y="219">Extremos cercanos a 0.08.</text><text class="line" x="754.0" y="257">Distinto compromiso espectral.</text><text class="line" x="754.0" y="295">No llega a cero en los bordes.</text><text x="45" y="347" class="foot">Las variantes periódicas usadas en STFT difieren ligeramente de estas fórmulas simétricas.</text></svg>