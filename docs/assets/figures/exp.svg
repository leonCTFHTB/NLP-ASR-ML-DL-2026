<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 372" role="img"><rect width="100%" height="100%" rx="18" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:21px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="45" y="60" class="title">De una diferencia de puntuaciones a un cociente</text><rect x="45.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="67.0" y="135">Identidad exacta</text><text class="line" x="67.0" y="181">exp(a − b) = exp(a) / exp(b)</text><text class="line" x="67.0" y="219">a y b son escalares.</text><text class="line" x="67.0" y="257">exp(a) es positivo;</text><text class="line" x="67.0" y="295">no suma uno automáticamente.</text><rect x="732.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="754.0" y="135">Motivación de GloVe</text><text class="line" x="754.0" y="181">Comparar dos centros i, j</text><text class="line" x="754.0" y="219">frente al mismo contexto k.</text><text class="line" x="754.0" y="257">(wᵢ − wⱼ) · w̃ₖ</text><text class="line" x="754.0" y="295">modela una relación logarítmica.</text><text x="45" y="347" class="foot">El objetivo final también incorpora los sesgos de centro y contexto.</text></svg>