<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 372" role="img"><rect width="100%" height="100%" rx="18" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:21px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="45" y="60" class="title">RoPE: posición como rotación de Q y K</text><rect x="45.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="67.0" y="135">Por pareja</text><text class="line" x="67.0" y="181">Rₘ = [ cos(mθ)  −sin(mθ) ]</text><text class="line" x="67.0" y="219">          [ sin(mθ)    cos(mθ) ]</text><text class="line" x="67.0" y="257">q̃ₘ = Rₘ qₘ; k̃ₙ = Rₙ kₙ</text><text class="line" x="67.0" y="295">Rotación: conserva la norma.</text><rect x="732.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="754.0" y="135">Producto punto</text><text class="line" x="754.0" y="181">q̃ₘᵀ k̃ₙ = qₘᵀ Rₘᵀ Rₙ kₙ</text><text class="line" x="754.0" y="219">Rₘᵀ Rₙ = Rₙ₋ₘ</text><text class="line" x="754.0" y="257">La parte rotatoria depende</text><text class="line" x="754.0" y="295">de la distancia relativa n − m.</text><text x="45" y="347" class="foot">No garantiza extrapolación ilimitada. En la formulación habitual se rotan Q y K, no los embeddings de V.</text></svg>