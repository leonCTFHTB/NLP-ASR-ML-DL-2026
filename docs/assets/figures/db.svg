<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 372" role="img"><rect width="100%" height="100%" rx="18" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:21px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="45" y="60" class="title">Decibelios: declarar magnitud, potencia y referencia</text><rect x="45.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="67.0" y="135">Magnitud A</text><text class="line" x="67.0" y="181">20 log₁₀(A / Aref)</text><text class="line" x="67.0" y="219">Piso εA antes del logaritmo.</text><text class="line" x="67.0" y="257">Una STFT sin normalizar</text><text class="line" x="67.0" y="295">puede producir A &gt; 1.</text><rect x="732.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="754.0" y="135">Potencia P = A²</text><text class="line" x="754.0" y="181">10 log₁₀(P / Pref)</text><text class="line" x="754.0" y="219">Equivalencia si Pref = Aref²</text><text class="line" x="754.0" y="257">y εP = εA².</text><text class="line" x="754.0" y="295">No son automáticamente dBFS.</text><text x="45" y="347" class="foot">Referencia espectral uno no equivale por sí sola a una calibración acústica o de escala completa.</text></svg>