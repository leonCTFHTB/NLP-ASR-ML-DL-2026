<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Tres relaciones geométricas del coseno</title><desc id="desc"></desc><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#91b9e3"/></marker><marker id="gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d9c58f"/></marker><marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b8a5ee"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e6a09d"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a9cbb5"/></marker></defs><rect width="1040" height="620" rx="16" fill="#111318"/><text x="38" y="49" fill="#d9c58f" font-size="30" text-anchor="start" font-weight="650" font-family="DejaVu Sans,Arial,sans-serif">Tres relaciones geométricas del coseno</text><line x1="38" y1="73" x2="1002" y2="73" stroke="#414a5d" stroke-width="2"/><text x="185" y="135" fill="#e5e7eb" font-size="23" text-anchor="middle" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Misma dirección</text><line x1="75" y1="315" x2="300" y2="315" stroke="#414a5d" stroke-width="2"/><line x1="185" y1="200" x2="185" y2="425" stroke="#414a5d" stroke-width="2"/><path d="M185,315 L285,315" fill="none" stroke="#91b9e3" stroke-width="6" marker-end="url(#blue)"/><path d="M185,315 L285.0,315.0" fill="none" stroke="#d9c58f" stroke-width="3" marker-end="url(#gold)"/><text x="185" y="485" fill="#e5e7eb" font-size="26" text-anchor="middle" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">θ = 0°</text><text x="185" y="530" fill="#d9c58f" font-size="29" text-anchor="middle" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">cos θ = 1</text><text x="520" y="135" fill="#e5e7eb" font-size="23" text-anchor="middle" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Ortogonalidad</text><line x1="410" y1="315" x2="635" y2="315" stroke="#414a5d" stroke-width="2"/><line x1="520" y1="200" x2="520" y2="425" stroke="#414a5d" stroke-width="2"/><path d="M520,315 L620,315" fill="none" stroke="#91b9e3" stroke-width="6" marker-end="url(#blue)"/><path d="M520,315 L520.0,215.0" fill="none" stroke="#d9c58f" stroke-width="3" marker-end="url(#gold)"/><text x="520" y="485" fill="#e5e7eb" font-size="26" text-anchor="middle" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">θ = 90°</text><text x="520" y="530" fill="#d9c58f" font-size="29" text-anchor="middle" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">cos θ = 0</text><text x="855" y="135" fill="#e5e7eb" font-size="23" text-anchor="middle" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Dirección opuesta</text><line x1="745" y1="315" x2="970" y2="315" stroke="#414a5d" stroke-width="2"/><line x1="855" y1="200" x2="855" y2="425" stroke="#414a5d" stroke-width="2"/><path d="M855,315 L955,315" fill="none" stroke="#91b9e3" stroke-width="6" marker-end="url(#blue)"/><path d="M855,315 L755.0,315.0" fill="none" stroke="#d9c58f" stroke-width="3" marker-end="url(#gold)"/><text x="855" y="485" fill="#e5e7eb" font-size="26" text-anchor="middle" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">θ = 180°</text><text x="855" y="530" fill="#d9c58f" font-size="29" text-anchor="middle" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">cos θ = −1</text></svg>