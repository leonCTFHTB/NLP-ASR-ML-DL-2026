<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 372" role="img"><rect width="100%" height="100%" rx="18" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:21px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="45" y="60" class="title">Pares observados y ponderación en GloVe</text><rect x="45.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="67.0" y="135">Dominio</text><text class="line" x="67.0" y="181">Usar solo pares x &gt; 0.</text><text class="line" x="67.0" y="219">No evaluar log(0).</text><text class="line" x="67.0" y="257">0 × log(0) no es un atajo</text><text class="line" x="67.0" y="295">numéricamente válido.</text><rect x="732.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="754.0" y="135">Peso h(x)</text><text class="line" x="754.0" y="181">(x / xₘₐₓ)^α si 0 &lt; x &lt; xₘₐₓ</text><text class="line" x="754.0" y="219">1 si x ≥ xₘₐₓ</text><text class="line" x="754.0" y="257">Ejemplo: α = 0.75; xₘₐₓ = 100</text><text class="line" x="754.0" y="295">El peso se satura, el error no.</text><text x="45" y="347" class="foot">Esquema didáctico · las coordenadas y ejemplos no son resultados entrenados.</text></svg>