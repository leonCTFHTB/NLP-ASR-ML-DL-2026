<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 372" role="img"><rect width="100%" height="100%" rx="18" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:21px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="45" y="60" class="title">Dos formas de usar las estadísticas de contexto</text><rect x="45.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="67.0" y="135">Word2Vec</text><text class="line" x="67.0" y="181">Extrae pares de ventanas.</text><text class="line" x="67.0" y="219">Predice centro o contexto.</text><text class="line" x="67.0" y="257">Negative sampling evita</text><text class="line" x="67.0" y="295">el softmax completo.</text><rect x="732.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="754.0" y="135">GloVe</text><text class="line" x="754.0" y="181">Agrega conteos de ventanas.</text><text class="line" x="754.0" y="219">Ajusta logaritmos de conteos.</text><text class="line" x="754.0" y="257">Entrena pares con xᵢⱼ &gt; 0.</text><text class="line" x="754.0" y="295">No garantiza mayor velocidad.</text><text x="45" y="347" class="foot">Ambos aprenden del corpus completo; «global» no significa una ventana de todo el documento.</text></svg>