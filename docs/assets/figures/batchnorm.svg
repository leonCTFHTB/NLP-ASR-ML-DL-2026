<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 372" role="img"><rect width="100%" height="100%" rx="18" fill="#191d26"/><style>text{font-family:system-ui,sans-serif;fill:#e5e7eb}.title{font-size:30px;font-weight:700}.head{font-size:24px;fill:#d9c58f;font-weight:650}.line{font-size:21px}.foot{font-size:17px;fill:#a8b0c1}</style><text x="45" y="60" class="title">Batch normalization: estadística y parámetros aprendidos</text><rect x="45.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="67.0" y="135">Durante el entrenamiento</text><text class="line" x="67.0" y="181">Media μ y varianza σ²</text><text class="line" x="67.0" y="219">estimadas sobre el lote.</text><text class="line" x="67.0" y="257">En una CNN, por canal,</text><text class="line" x="67.0" y="295">agregando lote y posiciones.</text><rect x="732.0" y="94" width="663.0" height="206" rx="12" fill="#222733" stroke="#3b4354"/><text class="head" x="754.0" y="135">Normalizar y transformar</text><text class="line" x="754.0" y="181">x̂ = (x − μ) / √(σ² + ε)</text><text class="line" x="754.0" y="219">y = γ x̂ + β</text><text class="line" x="754.0" y="257">γ y β se aprenden.</text><text class="line" x="754.0" y="295">Inferencia: estadísticas móviles.</text><text x="45" y="347" class="foot">El comportamiento de inferencia depende de la configuración; BatchNorm no elimina por sí sola todo cambio de distribución.</text></svg>